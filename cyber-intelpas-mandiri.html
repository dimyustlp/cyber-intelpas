/** Donat komposisi. Setiap potongan membawa judulnya sendiri untuk tooltip. */
function donat(bagian, ukuran = 168, tebal = 26) {
  const total = bagian.reduce((a, b) => a + b.nilai, 0)
  if (!total) return ''
  const r = (ukuran - tebal) / 2
  const pusat = ukuran / 2
  const keliling = 2 * Math.PI * r
  let jalan = 0

  const potongan = bagian.map((b) => {
    const panjang = (b.nilai / total) * keliling
    const el = `<circle cx="${pusat}" cy="${pusat}" r="${r}" fill="none"
      stroke="${b.warna}" stroke-width="${tebal}"
      stroke-dasharray="${panjang.toFixed(2)} ${(keliling - panjang).toFixed(2)}"
      stroke-dashoffset="${(-jalan).toFixed(2)}"
      transform="rotate(-90 ${pusat} ${pusat})"><title>${esc(b.label)}: ${angka(b.nilai)}</title></circle>`
    jalan += panjang
    return el
  }).join('')

  return `<svg viewBox="0 0 ${ukuran} ${ukuran}" width="${ukuran}" height="${ukuran}" role="img"
    aria-label="Komposisi ${bagian.map((b) => `${b.label} ${b.nilai}`).join(', ')}">
    <circle cx="${pusat}" cy="${pusat}" r="${r}" fill="none" stroke="${WARNA.garis2}" stroke-width="${tebal}"/>
    ${potongan}
    <text x="${pusat}" y="${pusat - 1}" text-anchor="middle"
      style="font-size:30px;font-weight:800;fill:${WARNA.tinta};letter-spacing:-0.04em">${angka(total)}</text>
    <text x="${pusat}" y="${pusat + 16}" text-anchor="middle"
      style="font-size:9px;letter-spacing:0.14em;fill:${WARNA.tinta4};font-family:monospace">PUBLIKASI</text>
  </svg>`
}

function legenda(bagian, total) {
  return `<dl class="legenda">${bagian.map((b) => `
    <div><i style="background:${b.warna}"></i><span>${esc(b.label)}</span>
      <b>${angka(b.nilai)}</b><em>${persen(b.nilai, total)}</em></div>`).join('')}</dl>`
}

/**
 * Batang harian: publikasi negatif per hari, dengan porsi berurgensi tinggi
 * ditandai lebih pekat, dan jumlah peristiwa sebagai titik di atasnya.
 */
function baganHarian(perHari) {
  if (!perHari.length) return '<p class="samar">Tidak ada data harian.</p>'
  const maks = Math.max(...perHari.map((h) => h.publikasi), 1)
  const L = 720
  const T = 168
  const kiri = 30
  const bawah = 30
  const lebarBidang = L - kiri - 12
  const tinggiBidang = T - bawah - 16
  const lebarBatang = Math.min(46, (lebarBidang / perHari.length) - 8)

  const x = (i) => kiri + (lebarBidang / perHari.length) * i + (lebarBidang / perHari.length - lebarBatang) / 2
  const tinggi = (n) => (n / maks) * tinggiBidang

  const kisi = [0, 0.5, 1].map((f) => {
    const y = 16 + tinggiBidang - f * tinggiBidang
    return `<line x1="${kiri}" x2="${L - 12}" y1="${y}" y2="${y}" stroke="${WARNA.garis2}" stroke-width="1"/>
      <text x="${kiri - 6}" y="${y + 3}" text-anchor="end"
        style="font-size:8.5px;fill:${WARNA.tinta4};font-family:monospace">${Math.round(f * maks)}</text>`
  }).join('')

  const batang = perHari.map((h, i) => {
    const tp = tinggi(h.publikasi)
    const tt = tinggi(h.tinggi)
    const y = 16 + tinggiBidang - tp
    return `<g><title>${esc(tanggalPendek(h.tanggal))}: ${h.publikasi} publikasi, ${h.peristiwa} peristiwa, ${h.tinggi} berurgensi tinggi</title>
      <rect x="${x(i)}" y="${y}" width="${lebarBatang}" height="${Math.max(tp, h.publikasi ? 2 : 0)}"
        rx="3" fill="${WARNA.kritis}" opacity="0.28"/>
      ${tt ? `<rect x="${x(i)}" y="${16 + tinggiBidang - tt}" width="${lebarBatang}" height="${Math.max(tt, 2)}"
        rx="3" fill="${WARNA.kritis}"/>` : ''}
      ${h.publikasi ? `<text x="${x(i) + lebarBatang / 2}" y="${y - 5}" text-anchor="middle"
        style="font-size:10px;font-weight:700;fill:${WARNA.tinta}">${h.publikasi}</text>` : ''}
      <text x="${x(i) + lebarBatang / 2}" y="${T - 12}" text-anchor="middle"
        style="font-size:8.5px;fill:${WARNA.tinta3}">${esc(tanggalPendek(h.tanggal))}</text>
      <text x="${x(i) + lebarBatang / 2}" y="${T - 2}" text-anchor="middle"
        style="font-size:7.5px;fill:${WARNA.tinta4};font-family:monospace">${esc(namaHari(h.tanggal).slice(0, 3))}</text>
    </g>`
  }).join('')

  return `<svg viewBox="0 0 ${L} ${T}" role="img" class="bagan-lebar"
    aria-label="Publikasi negatif per hari">${kisi}${batang}</svg>
  <div class="legenda-baris">
    <span><i style="background:${WARNA.kritis};opacity:0.28"></i>Seluruh publikasi negatif</span>
    <span><i style="background:${WARNA.kritis}"></i>Berurgensi tinggi atau kritis</span>
  </div>`
}

/** Peringkat eksposur: batang mendatar, satu baris per peristiwa. */
function baganEksposur(peristiwa, maks = 8) {
  const butir = peristiwa.slice(0, maks)
  if (!butir.length) return ''
  const tertinggi = Math.max(...butir.map((p) => p.eksposur), 1)
  return `<div class="peringkat">${butir.map((p, i) => `
    <div class="peringkat-baris">
      <span class="peringkat-no">${i + 1}</span>
      <div class="peringkat-isi">
        <div class="peringkat-judul">${esc(potong(p.judul, 78))}</div>
        <div class="peringkat-lacak">
          <i style="width:${Math.max(4, (p.eksposur / tertinggi) * 100)}%;background:${WARNA[nadaUrgensi(p.urgensi)]}"></i>
        </div>
      </div>
      <div class="peringkat-angka">
        <b>${angka(p.jumlah_publikasi)}</b><span>publikasi</span>
      </div>
      <div class="peringkat-angka">
        <b>${angka(p.jumlah_media)}</b><span>media</span>
      </div>
    </div>`).join('')}</div>`
}

/** Sebaran wilayah sebagai pita bertingkat, bukan peta — cetak tetap terbaca. */
function baganProvinsi(perProvinsi) {
  if (!perProvinsi.length) return '<p class="samar">Belum ada peristiwa yang terhubung ke provinsi.</p>'
  const maks = Math.max(...perProvinsi.map((p) => p.publikasi), 1)
  return `<div class="wilayah">${perProvinsi.slice(0, 10).map((p) => `
    <div class="wilayah-baris">
      <span class="wilayah-nama">${esc(p.nama)}</span>
      <div class="wilayah-lacak">
        <i style="width:${(p.publikasi / maks) * 100}%"></i>
      </div>
      <b class="wilayah-angka">${angka(p.publikasi)}</b>
      <span class="wilayah-sub">${angka(p.peristiwa)} peristiwa</span>
    </div>`).join('')}</div>`
}

function potong(teks, n) {
  const t = String(teks ?? '').trim()
  return t.length <= n ? t : `${t.slice(0, n - 1).trimEnd()}…`
}

function halamanTelaah({ keadaan, isi }) {

  const awal = susunAntrean(semua).length + keadaanTelaah.selesai.size

  function gambar() {
    const antrean = susunAntrean(semua)
    const b = antrean[Math.min(keadaanTelaah.nomor, Math.max(0, antrean.length - 1))]

    if (!antrean.length) {
      isi.innerHTML = `<div class="tumpuk">

          isi: kosong(

            keadaanTelaah.selesai.size
              ? `${angka(keadaanTelaah.selesai.size)} publikasi selesai ditelaah pada sesi ini. Tidak ada lagi yang menunggu.`
              : 'Tidak ada publikasi yang menunggu telaah. Setiap hasil mesin sudah pernah dibaca manusia.',
            tombol({ label: 'Kembali ke dasbor', ikon: 'dasbor', gaya: 'utama', halaman: 'dasbor' }),

              <div class="telaah-meta">
                ${[
                  b.media ? amankan(b.media) : '',
                  b.nama_upt ? amankan(b.nama_upt) : '<span class="kritis-teks">unit belum dipetakan</span>',
                  b.tanggal_publikasi ? amankan(tanggalJam(b.tanggal_publikasi)) : amankan(jarakWaktu(b.created_at)),
                  b.link ? amankan(asalTautan(b.link)) : '',
                ].filter(Boolean).join(' <span class="pemisah">·</span> ')}
              </div>
              ${b.ringkasan ? `<p class="telaah-ringkas">${amankan(ringkas(b.ringkasan, 600))}</p>` : ''}
            </article>

              ${panelMesin(b)}
              <div>
                ${keadaanTelaah.koreksi
                  ? panelKoreksi(b)
                  : `<div class="telaah-tuntun">
                      <p>Bacalah judul dan penilaian mesin di sebelah kiri, lalu putuskan.</p>
                      <ul>
                        <li><b>Setujui</b> bila penilaiannya sudah tepat.</li>
                        <li><b>Koreksi</b> bila kategorinya keliru — dan sebutkan kelirunya.</li>
                        <li><b>Tidak valid</b> bila ini bukan berita, atau bukan urusan Pemasyarakatan.</li>
                      </ul>
                      <p class="ket">Pintasan papan tik: <kbd>S</kbd> setujui, <kbd>K</kbd> koreksi,
                      <kbd>X</kbd> tidak valid, <kbd>→</kbd> lewati.</p>
                    </div>`}
              </div>
            </div>`,
        })}

          ${keadaanTelaah.koreksi
            ? `${tombol({ label: 'Simpan koreksi', ikon: 'centang', gaya: 'utama', aksi: 'simpan-koreksi', nonaktif: keadaanTelaah.sibuk })}
               ${tombol({ label: 'Batal', aksi: 'batal-koreksi' })}`
            : `${tombol({ label: 'Setujui', ikon: 'centang', gaya: 'utama', aksi: 'setujui', nonaktif: keadaanTelaah.sibuk })}
               ${tombol({ label: 'Koreksi', ikon: 'saring', aksi: 'koreksi' })}
               ${tombol({ label: 'Tidak valid', ikon: 'tutup', gaya: 'bahaya', aksi: 'tolak' })}
               <span class="dorong"></span>
               ${tombol({ label: 'Lewati', ikon: 'panahKanan', gaya: 'samar', aksi: 'lewati' })}`}

  }

  /* ---------------------------------------------------------- keputusan */

  function beritaSekarang() {
    const antrean = susunAntrean(semua)
    return antrean[Math.min(keadaanTelaah.nomor, Math.max(0, antrean.length - 1))]

  async function putuskan(b, isian, kabar) {

    keadaanTelaah.sibuk = true
    const sebelum = { ...b }
    Object.assign(b, isian)
    keadaanTelaah.selesai.add(b.id)
    keadaanTelaah.nomor = 0
    gambar()

    if (keadaan.demo) {
      roti(`${kabar} (mode peragaan, tidak disimpan)`, 'sedang')
      keadaanTelaah.sibuk = false
      return

    try {
      await perbarui('berita', { id: `eq.${b.id}` }, isian)
      roti(kabar, 'positif')
    } catch (galat) {
      Object.assign(b, sebelum)
      keadaanTelaah.selesai.delete(b.id)
      roti(pesanRamah(galat), 'kritis', 6000)
      gambar()
    } finally {
      keadaanTelaah.sibuk = false
    }
  }

  function setujui() {
    const b = beritaSekarang()
    if (!b) return
    keadaanTelaah.disetujui += 1
    putuskan(b, {
      status_verifikasi: 'Terverifikasi',
      ai_reviewed_by: keadaan.profil?.username || keadaan.profil?.full_name || null,
      ai_reviewed_at: new Date().toISOString(),
      verified_by: keadaan.profil?.username || keadaan.profil?.full_name || null,
      verified_at: new Date().toISOString(),
    }, 'Penilaian mesin disetujui.')
  }

  async function simpanKoreksi() {
    const b = beritaSekarang()
    if (!b) return
    const kode = isi.querySelector('#koreksi-sub')?.value
    const sub = SEMUA_SUBKATEGORI.find((s) => s.kode === kode)
    const catatan = isi.querySelector('#koreksi-catatan')?.value.trim() || ''

    if (!catatan) {
      roti('Sebutkan apa yang keliru. Koreksi tanpa alasan tidak bisa dipakai memperbaiki mesin.', 'sedang', 5000)
      isi.querySelector('#koreksi-catatan')?.focus()
      return
    }

    const luar = kode === '9.1' || kode === '9.2'
    keadaanTelaah.dikoreksi += 1
    keadaanTelaah.koreksi = false

    await putuskan(b, {
      subkategori_kode: kode,
      subkategori: sub ? sub.nama : (kode === '0.1' ? 'Belum Dikelompokkan' : 'Konten Tidak Relevan'),
      kategori: sub ? sub.kategoriNama : (luar ? 'Di Luar Lingkup' : 'Lainnya'),
      sentimen: isi.querySelector('#koreksi-sentimen')?.value,
      urgensi: isi.querySelector('#koreksi-urgensi')?.value,
      status_verifikasi: 'Terverifikasi',
      review_note: catatan,
      ai_reviewed_by: keadaan.profil?.username || keadaan.profil?.full_name || null,
      ai_reviewed_at: new Date().toISOString(),
      verified_by: keadaan.profil?.username || keadaan.profil?.full_name || null,
      verified_at: new Date().toISOString(),
    }, 'Koreksi tersimpan.')
  }

  async function tolak() {
    const b = beritaSekarang()
    if (!b) return
    const ya = await konfirmasi({
      judul: 'Tandai tidak valid?',
      pesan: `“${ringkas(b.judul, 80)}” tidak akan ikut dihitung dalam laporan mana pun. `
        + 'Datanya tetap tersimpan dan masih bisa dilihat di Pusat Data Berita.',
      tegas: 'Tandai tidak valid', bahaya: true,
    })
    if (!ya) return
    keadaanTelaah.ditolak += 1
    putuskan(b, {
      status_verifikasi: 'Tidak Valid',
      ai_reviewed_by: keadaan.profil?.username || keadaan.profil?.full_name || null,
      ai_reviewed_at: new Date().toISOString(),
    }, 'Ditandai tidak valid.')
  }

  function lewati() {
    const antrean = susunAntrean(semua)
    keadaanTelaah.nomor = (keadaanTelaah.nomor + 1) % Math.max(antrean.length, 1)
    keadaanTelaah.koreksi = false
    gambar()
  }

  /* ------------------------------------------------------------ penyimak */

  isi.addEventListener('click', (ev) => {
    const aksi = ev.target.closest('[data-aksi]')?.dataset.aksi
    if (!aksi) return
    if (aksi === 'setujui') setujui()
    else if (aksi === 'koreksi') { keadaanTelaah.koreksi = true; gambar(); isi.querySelector('#koreksi-sub')?.focus() }
    else if (aksi === 'batal-koreksi') { keadaanTelaah.koreksi = false; gambar() }
    else if (aksi === 'simpan-koreksi') simpanKoreksi()
    else if (aksi === 'tolak') tolak()
    else if (aksi === 'lewati') lewati()
  })

  /*
     Pintasan papan tik. Antrean yang panjang dikerjakan dengan satu tangan di
     papan tik, dan menuntut tetikus untuk setiap keputusan menjadikan seratus
     telaah sebagai seratus perjalanan kursor.

     Tidak berlaku saat sedang mengetik di kolom isian, supaya huruf "s" pada
     catatan koreksi tidak diam-diam menyetujui berita.
  */
  function pintasan(ev) {
    if (!isi.isConnected) { document.removeEventListener('keydown', pintasan); return }
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return
    const t = ev.target
    if (t.matches('input, textarea, select')) return
    if (document.querySelector('.tirai, .palet-tirai')) return

    const k = ev.key.toLowerCase()
    if (k === 's') { ev.preventDefault(); setujui() }
    else if (k === 'k') { ev.preventDefault(); keadaanTelaah.koreksi = true; gambar(); isi.querySelector('#koreksi-sub')?.focus() }
    else if (k === 'x') { ev.preventDefault(); tolak() }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); lewati() }
  }
  document.addEventListener('keydown', pintasan)

  gambar()

  return {
    judul: 'Antrean Telaah',
    sub: 'Memeriksa penilaian mesin sebelum dipakai sebagai dasar keputusan',
  }
}

return { halamanTelaah };

  const berikut = sekarang === '' ? 'terang' : sekarang === 'terang' ? 'gelap' : ''
  pasangTema(berikut)
  roti(
    berikut === '' ? 'Tampilan mengikuti pengaturan perangkat.'
      : berikut === 'terang' ? 'Tampilan terang.' : 'Tampilan gelap.',
    'aksen', 2200,
  )
  gambar()
}

/* --------------------------------------------------------------- kerangka */

function kerangka() {
  const peran = keadaan.profil.role
  const menu = menuUntuk(peran)
  const eksternal = adalahEksternal(peran)

  const daftarMenu = menu.map((g) => `
    <div class="nav-grup">
      <div class="nav-judul">${amankan(g.grup)}</div>
      ${g.butir.map((b) => {
        const jumlah = b.lencana ? keadaan.hitungan[b.lencana] : 0
        return `<button class="nav-butir" data-halaman="${b.id}"
          ${b.id === keadaan.halaman ? 'aria-current="page"' : ''}>
          ${ikon(b.ikon)}<span>${amankan(b.label)}</span>
          ${jumlah > 0 ? `<span class="lencana">${jumlah > 99 ? '99+' : jumlah}</span>` : ''}
        </button>`
      }).join('')}
    </div>`).join('')

  const info = PERAN[peran] || {}

  return `
  <a class="lompat" href="#isi">Lompat ke isi halaman</a>
  <div class="cangkang">
    <div class="tirai-menu" data-aksi="tutup-menu" aria-hidden="true"></div>
    <aside class="samping" id="samping">
      <div class="merek">
        <div class="merek-lambang">CI</div>
        <div class="merek-teks">
          <div class="merek-nama">Cyber-Intelpas</div>
          <div class="merek-sub">${amankan(eksternal ? 'Portal Kantor Wilayah' : 'Dirpamintel · Ditjen PAS')}</div>
        </div>
      </div>

      <nav class="nav" aria-label="Navigasi utama">${daftarMenu}</nav>

      <div class="kaki-samping">
        <div class="avatar">${amankan(inisial(keadaan.profil.full_name))}</div>
        <div style="min-width:0;flex:1">
          <div class="kaki-nama potong">${amankan(keadaan.profil.full_name)}</div>
          <div class="kaki-peran potong">${amankan(info.ringkas || labelPeran(peran))}</div>
        </div>
        ${tombolIkon({ ikon: 'keluar', aksi: 'keluar', judul: 'Keluar dari sesi', kecil: true })}
      </div>
    </aside>

    <div class="kolom-utama">
      <header class="bilah">
        <button class="tbl ikon samar hanya-sempit" data-aksi="menu"
          aria-label="Buka menu navigasi" aria-expanded="false"
          aria-controls="samping">${ikon('menu')}</button>
        <div>
          <div class="bilah-judul" id="bilah-judul"></div>
          <div class="bilah-sub" id="bilah-sub"></div>
        </div>
        <div class="bilah-kanan">
          ${keadaan.demo ? '<span class="keping" data-nada="sedang">Mode peragaan</span>' : ''}
          <button class="cari-pemicu" data-aksi="cari" aria-label="Cari halaman, unit, atau berita">
            ${ikon('cari')}<span>Cari…</span><kbd>Ctrl K</kbd>
          </button>
          ${tombolIkon({ ikon: 'segar', aksi: 'muat-ulang', judul: 'Muat ulang data' })}
          ${tombolIkon({ ikon: document.documentElement.dataset.tema === 'gelap' ? 'terang' : 'gelap', aksi: 'tema', judul: 'Ganti tampilan terang atau gelap' })}
        </div>
      </header>

      <main class="isi" id="isi" tabindex="-1"></main>
    </div>
  </div>`
}

/* ---------------------------------------------------------------- gambar */

function gambar() {
  if (!keadaan.profil) {
    akar.innerHTML = ''
    akar.appendChild(halamanMasuk({ onMasuk: mulaiSesi }))
    return
  }

  akar.innerHTML = kerangka()
  const isi = document.getElementById('isi')
  const bangun = HALAMAN[keadaan.halaman] || halamanBelumSiap

  try {
    const hasil = bangun({ keadaan, isi })
    document.getElementById('bilah-judul').textContent = hasil?.judul || 'Cyber-Intelpas'
    document.getElementById('bilah-sub').textContent = hasil?.sub || tanggalPanjang(new Date())
    // Gerak dipasang setelah isinya jadi, bukan sebelumnya. Kalau dipasang di
    // dalam tiap halaman, cepat atau lambat ada halaman yang lupa memasangnya.
    hidupkan(isi, { ruang: keadaan.halaman || 'umum' })
  } catch (galat) {
    isi.innerHTML = `<div class="pesan" data-nada="kritis">${ikon('peringatan')}
      <div><b>Halaman gagal ditampilkan.</b><br>${amankan(galat.message)}</div></div>`
    console.error(galat)
  }
}

/* -------------------------------------------------------------- navigasi */

function keHalaman(id) {
  keadaan.halaman = id
  history.replaceState(null, '', `#${id}`)
  // Peralihan membuat perpindahan halaman terbaca sebagai satu gerakan, bukan
  // sebagai layar yang berkedip. Pada peramban yang belum mendukungnya,
  // halaman berganti seperti biasa.
  denganPeralihan(() => gambar())
  document.getElementById('isi')?.focus({ preventScroll: true })
  window.scrollTo({ top: 0 })
}

/* ---------------------------------------------------------- menu sempit */
/*
   Di layar sempit, tepi kiri berubah menjadi laci yang menutupi isi halaman.
   Laci semacam itu menuntut tiga hal yang mudah terlupa, dan ketiganya pernah
   tidak ada di sini: tombol pembukanya harus benar-benar terlihat, ia harus
   bisa ditutup tanpa menekan tombol yang sama, dan tombol Esc harus bekerja
   — sebab laci yang menutupi seluruh layar tanpa jalan keluar yang jelas
   adalah jebakan, bukan navigasi.
*/

function menuTerbuka() {
  return document.getElementById('samping')?.classList.contains('buka') || false
}

function bukaMenu() {
  const samping = document.getElementById('samping')
  if (!samping) return
  samping.classList.add('buka')
  document.querySelector('[data-aksi="menu"]')?.setAttribute('aria-expanded', 'true')
  document.body.classList.add('menu-terbuka')
  // Fokus dipindahkan ke dalam laci supaya papan tik tidak tertinggal di
  // belakang tirai, menekan tombol yang tidak terlihat siapa pun.
  samping.querySelector('.nav-butir')?.focus({ preventScroll: true })
}

function tutupMenu() {
  const samping = document.getElementById('samping')
  if (!samping?.classList.contains('buka')) return
  samping.classList.remove('buka')
  document.body.classList.remove('menu-terbuka')
  const tombol = document.querySelector('[data-aksi="menu"]')
  tombol?.setAttribute('aria-expanded', 'false')
  tombol?.focus({ preventScroll: true })
}

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && menuTerbuka()) tutupMenu()

  // Ctrl+K, atau Cmd+K pada Mac. Dicegat sebelum peramban memakainya untuk
  // kotak alamatnya sendiri — di dalam aplikasi ini, pencarian yang dimaksud
  // orang ketika menekan Ctrl+K adalah pencarian isi, bukan pencarian web.
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k' && !paletTerbuka()) {
    if (!keadaan.profil) return
    ev.preventDefault()
    bukaPalet(keadaan, keHalaman)
  }
})

document.addEventListener('click', async (ev) => {
  const nav = ev.target.closest('[data-halaman]')
  if (nav) {
    // Memilih halaman menutup lacinya. Membiarkannya terbuka berarti halaman
    // yang baru dipilih tertutup oleh menu yang memilihnya.
    if (menuTerbuka()) tutupMenu()
    keHalaman(nav.dataset.halaman)
    return
  }

  const aksi = ev.target.closest('[data-aksi]')?.dataset.aksi
  if (!aksi) return

  if (aksi === 'tema') putarTema()
  else if (aksi === 'menu') bukaMenu()
  else if (aksi === 'tutup-menu') tutupMenu()
  else if (aksi === 'cari') bukaPalet(keadaan, keHalaman)
  else if (aksi === 'muat-ulang') { await segarkan(); roti('Data dimuat ulang.', 'positif') }
  else if (aksi === 'keluar') {
    await keluar()
    keadaan.profil = null
    keadaan.halaman = null
    lupakanNilai()
    gambar()
  }
})

window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1)
  if (id && id !== keadaan.halaman) keHalaman(id)
})

// Halaman yang menyaring datanya sendiri meminta gambar ulang lewat acara ini,
// supaya tidak perlu mengimpor balik main.js dan membuat lingkaran impor.
document.addEventListener('gambar-ulang', () => gambar())

/* ------------------------------------------------------------------ data */

async function segarkan() {
  if (keadaan.demo) {
    keadaan.berita = buatBerita()
    keadaan.kesehatan = {
      status: 'sehat', masuk_sehari: 6, masuk_sepekan: 41, masuk_pekan_lalu: 38,
      perubahan_persen: 8, sinkron_jeda_menit: 3, baris_jeda_jam: 2, sinkron_gagal_sehari: 0,
    }
  } else {
    try {
      const { ambil } = __minta('js/lib/api.js')
      keadaan.berita = await ambil('berita', {
        select: 'id,judul,nama_upt,media,platform,link,created_at,tanggal_publikasi,kategori,subkategori,sentimen,urgensi,tingkat_perhatian,status_verifikasi,source_type,ringkasan,rekomendasi,ai_confidence',
        deleted_at: 'is.null',
        order: 'created_at.desc',
        limit: 400,
      }) || []
    } catch (galat) {
      roti(pesanRamah(galat), 'kritis', 6000)
      keadaan.berita = []
    }

    // Kesehatan aliran data ditanyakan terpisah, dan kegagalannya tidak boleh
    // menjatuhkan seluruh layar. Kalau pemeriksaan ini tidak bisa dijalankan,
    // yang hilang hanyalah satu bilah peringatan — bukan dasbornya.
    try {
      const { panggilFungsi } = __minta('js/lib/api.js')
      keadaan.kesehatan = await panggilFungsi('kesehatan_asupan')
    } catch {
      keadaan.kesehatan = null
    }
  }

  // Berita di luar lingkup tetap tersimpan dan tetap bisa ditelaah di Pusat
  // Data Berita, tetapi tidak ikut menjadi angka. Perkara Rutan KPK bukan
  // beban unit Pemasyarakatan mana pun, dan unggahan berbahasa asing yang
  // kebetulan memuat kata "lapas" bukan pemberitaan sama sekali.
  keadaan.dalamLingkup = keadaan.berita.filter((b) => b.kategori !== 'Di Luar Lingkup')
  keadaan.luarLingkup = keadaan.berita.length - keadaan.dalamLingkup.length

  keadaan.hitungan = {
    peringatan: keadaan.dalamLingkup.filter((b) => ['Tinggi', 'Kritis'].includes(b.urgensi)
      && !['Tidak Valid', 'Diarsipkan'].includes(b.status_verifikasi)).length,
    telaah: keadaan.dalamLingkup.filter((b) => b.status_verifikasi === 'Belum Ditelaah').length,
    negatif: keadaan.dalamLingkup.filter((b) => b.sentimen === 'Negatif'
      && !['Tidak Valid', 'Diarsipkan'].includes(b.status_verifikasi)).length,
    pemetaan: keadaan.dalamLingkup.filter((b) => !b.nama_upt
      || ['Belum Teridentifikasi', 'Tidak diketahui'].includes(b.nama_upt)).length,
  }
  gambar()
}

async function mulaiSesi(profil) {
  keadaan.profil = profil
  keadaan.halaman = location.hash.slice(1) || halamanAwal(profil.role)
  await segarkan()
}

/* ------------------------------------------------------------------ mulai */

async function mulai() {
  pasangTema(temaTersimpan())

  if (keadaan.demo) {
    const peran = new URLSearchParams(location.search).get('peran') || 'media_intelligence_analyst'
    await mulaiSesi(profilDemo(PERAN[peran] ? peran : 'media_intelligence_analyst'))
    return
  }

  const sesi = muatSesi()
  if (!sesi) { gambar(); return }

  try {
    const profil = profilSekarang() || await muatProfil()
    if (!profil) throw new Error('Profil pengguna tidak ditemukan.')
    await mulaiSesi(profil)
  } catch (galat) {
    console.warn('Sesi tersimpan tidak dapat dipulihkan:', galat)
    keadaan.profil = null
    gambar()
  }
}

mulai()

return { keadaan, gambar, keHalaman };
});

/* Terpilih ditandai tepi berwarna sekaligus latar, bukan warna saja: satu
   penanda yang hanya berupa rona akan hilang bagi sebagian pembaca. */
.pilih-kartu:has(input:checked) {
  border-color: var(--nada-pilih);
  box-shadow: inset 3px 0 0 var(--nada-pilih);
  background: var(--surface-3);
}

.pilih-kartu:has(input:focus-visible) {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.pilih-isi { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

.pilih-judul {
  font-size: 13px;
  font-weight: 650;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 7px;
}

.pilih-ringkas {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--nada-pilih);
  font-weight: 600;
}

.pilih-ket { font-size: 11.5px; line-height: 1.5; color: var(--ink-3); }

.pilih-petunjuk {
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--ink-4);
  border-left: 2px solid var(--line-2);
  padding-left: 8px;
  margin-top: 2px;
}

/* ==========================================================================
   Baris rekonsiliasi dasbor
   --------------------------------------------------------------------------
   Penjumlahan ditulis apa adanya di layar supaya selisih berikutnya terbaca
   oleh pembacanya sendiri, bukan ditemukan berbulan-bulan kemudian ketika
   seseorang kebetulan membandingkan dua halaman.
   ========================================================================== */

.rekonsiliasi {
  border: 1px solid var(--line-2);
  border-radius: var(--r-3);
  background: var(--surface-2);
  padding: 11px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rekon-baris {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px 12px;
}

.rekon-hitung {
  font-size: 12.5px;
  color: var(--ink-2);
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 5px;
}

.rekon-hitung b { color: var(--ink); font-variant-numeric: tabular-nums; }
.rekon-sama, .rekon-tambah { color: var(--ink-4); font-family: var(--mono); }
.rekon-kaki { font-size: 11.5px; color: var(--ink-4); line-height: 1.5; }

/* Penanda kolom wajib pada borang input. */
.wajib {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--kritis);
  background: var(--kritis-bg);
  border-radius: var(--r-1);
  padding: 1px 5px;
  margin-left: 5px;
  vertical-align: 1px;
}

/* Borang input memakai area teks yang lebih tinggi daripada bawaan kolom. */
#borang-input textarea.masukan {
  height: auto;
  min-height: 96px;
  padding: 8px 10px;
  line-height: 1.55;
  resize: vertical;
}

#borang-input .pilihan.penuh { width: 100%; min-width: 0; }

/* ==========================================================================
   Ruang kantor wilayah
   --------------------------------------------------------------------------
   Aplikasinya satu, ruangnya dua. Petugas wilayah tidak boleh mengira sedang
   membaca angka nasional, dan petugas pusat yang tidak sengaja masuk dengan
   akun wilayah harus menyadarinya sebelum sempat menyimpulkan apa pun.

   Pembedanya warna aksen — biru laut kelembagaan berganti menjadi hijau
   pemasyarakatan — bukan tata letak yang berbeda. Tata letak yang berbeda
   menuntut orang mempelajari dua aplikasi; warna yang berbeda cukup untuk
   menyatakan "ini ruang lain" tanpa menuntut apa pun.

   Yang menahan data tetap policy di basis data. Warna hanya memberi tahu.
   ========================================================================== */

.cangkang[data-ruang="wilayah"] {
  --accent:      #14584A;
  --accent-2:    #1C7A66;
  --accent-soft: #DCEDE7;
  --accent-tepi: #B4D6CB;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-tema="terang"]) .cangkang[data-ruang="wilayah"] {
    --accent:      #63C4AC;
    --accent-2:    #85D6C1;
    --accent-soft: #10302A;
    --accent-tepi: #1F4A40;
  }
}

:root[data-tema="gelap"] .cangkang[data-ruang="wilayah"] {
  --accent:      #63C4AC;
  --accent-2:    #85D6C1;
  --accent-soft: #10302A;
  --accent-tepi: #1F4A40;
}

/* Lambang kelembagaan tidak diganggu — ia penanda instansi, bukan penanda
   ruang. Yang berbicara adalah keterangan di bawahnya dan sebilah pita tipis
   di kepala kolom utama, keduanya memakai aksen ruang ini. */
.cangkang[data-ruang="wilayah"] .merek-sub {
  color: var(--accent-2);
  font-weight: 600;
}

.cangkang[data-ruang="wilayah"] .kolom-utama { position: relative; }

.cangkang[data-ruang="wilayah"] .kolom-utama::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  z-index: 5;
}

/* Satu baris tabel yang sedang disunting berubah menjadi panel, bukan kolom
   yang bisa diketik langsung. Menyunting peran dan wilayah adalah tindakan yang
   pantas diberi jeda — bukan sesuatu yang terjadi karena kursor tidak sengaja
   mendarat di sel yang salah. */
.baris-sunting > td { background: var(--surface-3); }

.sunting-pengguna {
  padding: 14px 4px 6px;
  display: flex;
  flex-direction: column;
}

.sunting-pengguna .pilihan.penuh,
.sunting-pengguna .masukan { width: 100%; min-width: 0; }

/* ==========================================================================
   Ruang unit pelaksana teknis
   --------------------------------------------------------------------------
   Ruang ketiga, sesudah ruang pusat dan ruang kantor wilayah. Diberi aksen
   sendiri dengan alasan yang sama seperti ruang wilayah: petugas yang membuka
   dua akun berbeda pada dua tab harus tahu tab mana yang mana sebelum membaca
   satu kata pun — dan yang paling mahal bukan salah baca, melainkan angka satu
   unit yang dikira angka satu wilayah.

   Rona ambar dipilih karena ia bukan tetangga hijau ruang wilayah maupun biru
   ruang pusat pada lingkaran warna. Tiga ruang yang ronanya berdekatan hanya
   bisa dibedakan bila ketiganya dilihat berdampingan, dan pembedaan yang
   menuntut perbandingan tidak menolong siapa pun.
   ========================================================================== */

.cangkang[data-ruang="unit"] {
  --accent:      #8A5512;
  --accent-2:    #A76C1B;
  --accent-soft: #F7EBD9;
  --accent-tepi: #E3CBA2;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-tema="terang"]) .cangkang[data-ruang="unit"] {
    --accent:      #E0A757;
    --accent-2:    #EFC183;
    --accent-soft: #33240C;
    --accent-tepi: #4D3714;
  }
}

:root[data-tema="gelap"] .cangkang[data-ruang="unit"] {
  --accent:      #E0A757;
  --accent-2:    #EFC183;
  --accent-soft: #33240C;
  --accent-tepi: #4D3714;
}

.cangkang[data-ruang="unit"] .merek-sub {
  color: var(--accent-2);
  font-weight: 600;
}

.cangkang[data-ruang="unit"] .kolom-utama { position: relative; }

.cangkang[data-ruang="unit"] .kolom-utama::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  z-index: 5;
}

/* ==========================================================================
   Kop ruang daerah
   --------------------------------------------------------------------------
   Menyebutkan cakupan halaman di kepala layar, dengan ukuran yang tidak bisa
   dilewatkan. Sebelumnya keterangan itu berupa satu bilah pesan di antara ubin
   — terbaca sekali pada hari pertama, lalu menjadi bagian dari perabot.

   Angka di sebelah kanan sengaja tiga, bukan enam. Kop bukan tempat menaruh
   seluruh angka; ia tempat menjawab "saya sedang melihat apa, dan sebesar apa".
   ========================================================================== */

.kop-wilayah {
  display: flex;
  flex-wrap: wrap;
  gap: 18px 26px;
  align-items: flex-end;
  justify-content: space-between;
  padding: 18px 20px;
  border-radius: var(--r-3);
  border: 1px solid var(--accent-tepi);
  background:
    linear-gradient(135deg, var(--accent-soft) 0%, transparent 62%),
    var(--surface);
}

.kop-wilayah-teks { min-width: 0; max-width: 62ch; }

.kop-wilayah-teks h2 {
  font-size: 1.32rem;
  line-height: 1.25;
  margin: 4px 0 6px;
  letter-spacing: -0.012em;
}

.kop-wilayah-teks p {
  font-size: 12.5px;
  color: var(--ink-3);
  line-height: 1.5;
  margin: 0;
}

.kop-wilayah-angka {
  display: flex;
  gap: 22px;
  margin: 0;
  flex-wrap: wrap;
}

.kop-wilayah-angka dt {
  font-size: 10.5px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-4);
  white-space: nowrap;
}

.kop-wilayah-angka dd {
  margin: 2px 0 0;
  font-size: 1.45rem;
  font-weight: 700;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.kop-wilayah-angka dd[data-nada="kritis"] { color: var(--kritis); }

@media (max-width: 700px) {
  .kop-wilayah { padding: 15px 15px 16px; }
  .kop-wilayah-angka { gap: 16px; }
  .kop-wilayah-angka dd { font-size: 1.2rem; }
}

/* ==========================================================================
   Batang perbandingan di dalam tabel
   --------------------------------------------------------------------------
   Satu kolom berisi panjang, bukan angka kedua. Mata membandingkan panjang
   jauh lebih cepat daripada membandingkan sepuluh angka sekolom, dan angkanya
   tetap ada di kolom sebelahnya bagi yang memerlukan nilai pastinya.
   ========================================================================== */

.bar-lacak {
  height: 7px;
  border-radius: 3px;
  background: var(--line-3);
  overflow: hidden;
}

.bar-lacak .bar-isi {
  height: 100%;
  width: var(--lebar, 0%);
  border-radius: 3px;
  background: var(--accent);
}

.bar-lacak .bar-isi[data-nada="kritis"]  { background: var(--kritis); }
.bar-lacak .bar-isi[data-nada="sedang"]  { background: var(--tinggi); }
.bar-lacak .bar-isi[data-nada="positif"] { background: var(--positif); }
.bar-lacak .bar-isi[data-nada="netral"]  { background: var(--ink-4); }

/* ==========================================================================
   Sikap unit dan tanggapan tersimpan
   ========================================================================== */

.sikap-deret {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.sikap-baris { display: flex; flex-direction: column; gap: 5px; }

/* Tanggapan yang sudah pernah ditulis, ditampilkan di dalam kartu beritanya.
   Diberi tepi kiri, bukan kotak penuh: ia keterangan yang menempel pada berita
   di atasnya, bukan bagian yang berdiri sendiri. */
.tanggapan-tersimpan {
  margin-top: 12px;
  padding: 10px 12px;
  border-left: 3px solid var(--accent);
  background: var(--surface-3);
  border-radius: 0 var(--r-2) var(--r-2) 0;
}

.tanggapan-tersimpan p {
  margin: 6px 0 0;
  line-height: 1.55;
}

/* Status pusat di kaki panel mesin — keterangan, bukan kendali. */
.mesin-kaki {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--line-2);
}

.positif-teks { color: var(--positif); }

/* ==========================================================================
   Peta Sebaran
   --------------------------------------------------------------------------
   Petanya SVG biasa, digambar dari garis pantai yang tersimpan di dalam repo.
   Tidak ada ubin dari peladen luar, jadi tidak ada yang perlu ditunggu dan
   tidak ada yang bisa gagal dimuat.
   ========================================================================== */

.peta-tata {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 14px;
  align-items: start;
}

@media (max-width: 1080px) {
  .peta-tata { grid-template-columns: minmax(0, 1fr); }
}

/*
   Laut dan daratan diberi warnanya sendiri, bukan dipinjam dari token
   permukaan.

   Token permukaan disusun untuk kartu yang bertumpuk, dan selisih antartingkatnya
   memang dibuat halus. Dipakai untuk peta, selisih sehalus itu membuat kepulauan
   ini terbaca sebagai noda: daratannya nyaris tidak terpisah dari lautnya, dan
   titik unit yang berdiri di atasnya kehilangan acuan letak sama sekali.
*/
.peta-wadah {
  --peta-laut:  #DCE8F4;
  --peta-darat: #FBFCFE;
  --peta-tepi:  #93A6BD;

  position: relative;
  background: var(--peta-laut);
  border: 1px solid var(--line-2);
  border-radius: var(--r-2);
  overflow: hidden;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-tema="terang"]) .peta-wadah {
    --peta-laut:  #0A111C;
    --peta-darat: #24334C;
    --peta-tepi:  #4A5D80;
  }
}

:root[data-tema="gelap"] .peta-wadah {
  --peta-laut:  #0A111C;
  --peta-darat: #24334C;
  --peta-tepi:  #4A5D80;
}

/*
   Legenda peta ini duduk di bawah petanya, tidak melayang di atasnya seperti
   bawaan .peta-legenda.

   Kepulauan Indonesia membentang penuh dari tepi kiri sampai tepi kanan kotak
   pandang, sehingga tidak ada satu pun sudut yang benar-benar kosong: kotak
   yang melayang selalu menutupi unit seseorang. Yang tertutup itu justru tidak
   pernah disadari pembacanya — ia hanya melihat daerah yang kebetulan tidak
   berpenanda.
*/
.peta-tata .peta-legenda {
  position: static;
  box-shadow: none;
  border: 0;
  border-radius: 0;
  padding: 11px 4px 3px;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 6px 18px;
  background: none;
  font-size: 12px;
}

.peta-svg {
  display: block;
  width: 100%;
  height: auto;
  /* Kepulauan Indonesia jauh lebih lebar daripada tinggi; membiarkan tingginya
     mengikuti isi membuat peta setinggi satu layar penuh pada layar sempit. */
  max-height: min(62vh, 560px);
  cursor: grab;
  touch-action: none;
}

.peta-svg.menyeret { cursor: grabbing; }

.peta-daratan path {
  fill: var(--peta-darat);
  stroke: var(--peta-tepi);
  stroke-linejoin: round;
  /* Tebal garis tidak ikut membesar saat peta diperbesar; tanpa ini, garis
     pantai pada perbesaran penuh setebal pulaunya sendiri. */
  vector-effect: non-scaling-stroke;
  stroke-width: 0.7;
}

/* Tetangga digambar samar: hadir secukupnya untuk menjelaskan mengapa
   Kalimantan dan Papua terpotong, tanpa ikut menarik perhatian. */
.peta-tetangga path {
  fill: var(--peta-darat);
  fill-opacity: 0.4;
  stroke: none;
}

.peta-titik circle {
  stroke: var(--peta-darat);
  cursor: pointer;
  transition: r 120ms ease;
}

.peta-titik circle:hover,
.peta-titik circle:focus-visible {
  stroke: var(--ink);
  outline: none;
}

/* Gaya .peta-legenda sendiri sudah ada di bagian sistem desain — kotak
   melayang di sudut peta. Yang ditambahkan di sini hanya isi butirnya. */
.peta-legenda-butir {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--ink-2);
}

.peta-legenda-butir i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: block;
  flex: none;
}

/* Angkanya dirapatkan ke kanan supaya lima baris legenda terbaca sebagai satu
   kolom angka, bukan sebagai lima kalimat dengan panjang berbeda. */
.peta-legenda-butir b { color: var(--ink); margin-left: auto; }

.peta-catatan {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 4px 4px 2px;
  max-width: 92ch;
}

.peta-catatan svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }

/* -------------------------------------------------------- panel samping */

.peta-panel {
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: var(--r-3);
  padding: 14px 14px 16px;
  /* Menempel saat halaman digulir: daftar unit terpanas adalah alasan orang
     membuka halaman ini, dan menggulir peta tidak boleh membuatnya hilang. */
  position: sticky;
  top: 12px;
  max-height: calc(100vh - 90px);
  overflow-y: auto;
}

.peta-panel-kop {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.peta-panel-judul {
  font-size: 1.02rem;
  line-height: 1.3;
  margin: 2px 0 4px;
}

.peta-daftar,
.peta-berita { list-style: none; margin: 0; padding: 0; }

.peta-daftar button {
  display: flex;

    //
    // Satu unit di Indonesia bernama "Rutan Kelas IIB Negara" — Negara adalah
    // ibu kota Kabupaten Jembrana. Kata "negara" ada di daftar kata umum karena
    // ia bagian dari "rumah tahanan negara", sehingga unit ini tidak punya satu
    // pun token pembeda dan selama ini dibuang diam-diam dari indeks: satu dari
    // 531 unit yang tidak pernah bisa dikenali, tanpa jejak apa pun.
    //
    // Namanya tidak bisa dipakai — token "negara" akan cocok dengan frasa
    // "rumah tahanan negara" pada hampir setiap berita rutan di Indonesia, dan
    // memetakan semuanya ke Jembrana. Yang dipakai adalah nama kabupatennya,
    // yang justru memang ditulis wartawan: "Rutan Jembrana".
    if (!token.length) {
      token = normalkanUpt(upt.kabupaten_kota || upt.location_hint || '')
        .split(' ')
        .filter((t) => t.length > 1 && !KATA_UMUM.has(t))
      if (!token.length) continue
      dariWilayah += 1
    }

    const jenis = upt.jenis_upt || tebakJenis(nama)
    const kunci = token.join(' ')

    // Persaingan nama dihitung PER JENIS. "Lapas Kelas I Cipinang" dan "Rutan
    // Kelas I Cipinang" bukan nama kembar — keduanya bisa dibedakan dari kata
    // Lapas atau Rutan yang selalu ikut disebut wartawan.
    const kunciJenis = `${jenis}::${kunci}`
    hitungNama.set(kunciJenis, (hitungNama.get(kunciJenis) || 0) + 1)

    // Hitungan lintas jenis hanya mencakup Lapas dan Rutan.
    //
    // Angka ini dipakai satu-satunya untuk memutuskan apakah kelonggaran
    // Lapas↔Rutan boleh dipakai, dan pertanyaannya selalu sama: apakah nama
    // tempat ini menunjuk lebih dari satu tempat penahanan. LPKA dan Bapas
    // bukan tempat penahanan dan tidak pernah menjadi calon dalam kelonggaran
    // itu, sehingga kehadiran mereka tidak boleh menutupnya.
    //
    // Bukan soal teori: menambahkan 32 LPKA ke data induk mencabut keunikan
    // lima unit Lapas/Rutan sekaligus — di antaranya Karangasem dan Tomohon —
    // hanya karena sebuah LPKA berdiri di kota yang sama. Berita "kabur dari
    // Lapas Karangasem" tentang Rutan Karangasem akan berhenti terpetakan,
    // padahal tidak ada satu pun yang berubah pada unit itu.
    if (LINTAS_JENIS.has(jenis)) {
      hitungLintasJenis.set(kunci, (hitungLintasJenis.get(kunci) || 0) + 1)
    }

    const petunjuk = normalkanUpt(upt.location_hint || '')
    const kabkota = normalkanUpt(upt.kabupaten_kota || '').replace(/^(kota|kabupaten) /, '')
    if (kabkota) hitungKabkota.set(kabkota, (hitungKabkota.get(kabkota) || 0) + 1)

    for (const t of new Set(token)) {
      const kunciToken = `${jenis}::${t}`
      hitungTokenJenis.set(kunciToken, (hitungTokenJenis.get(kunciToken) || 0) + 1)
    }

    entri.push({
      nama,
      jenis,
      kelas: String(upt.kelas_upt || '').toLowerCase(),
      subjenis: upt.subjenis_upt || 'Umum',
      provinsi: upt.provinsi || '',
      kanwil: upt.kanwil || '',
      kabkota,
      token,
      // Varian tanpa spasi menangani "Lhok Seumawe" pada data induk yang di
      // media ditulis "Lhokseumawe", dan sebaliknya.
      tokenRapat: token.map((t) => t.replace(/\s+/g, '')),
      kunci,
      kunciJenis,
      namaNormal: normalkanUpt(nama),
      namaRapat: normalkanUpt(nama).replace(/\s+/g, ''),
      tempatRapat: tempatRapatDari(nama, token),
      petunjuk: petunjuk && petunjuk !== kunci ? petunjuk : '',
      sebutan: [],
    })
  }

  for (const e of entri) {
    e.bersaing = (hitungNama.get(e.kunciJenis) || 0) > 1
    // Nama tempatnya hanya dipakai satu tempat penahanan di seluruh Indonesia,
    // sehingga penyebutan jenis yang keliru pun masih menunjuk unit yang sama.
    e.unikNasional = LINTAS_JENIS.has(e.jenis) && (hitungLintasJenis.get(e.kunci) || 0) === 1
    e.kabkotaUnik = Boolean(e.kabkota) && (hitungKabkota.get(e.kabkota) || 0) === 1
    // Token yang cukup panjang untuk berarti, dan hanya dipakai unit ini di
    // seluruh Indonesia. "Ngaseman" dan "Sukamiskin" masuk; "Nusakambangan",
    // yang dipakai sembilan unit sekaligus, tidak.
    //
    // Nama provinsi juga tidak pernah masuk, walau secara hitungan ia bisa
    // saja hanya muncul pada satu unit. "Lampung" hanya dipakai Rutan Kelas I
    // Bandar Lampung di antara seluruh rutan — tetapi memberinya bobot sebagai
    // penunjuk membuat "napi kabur dari Rutan Lampung Timur" dipetakan ke
    // Bandar Lampung dengan keyakinan 72 persen, tepat melewati ambang, dan
    // sekaligus menutup lapisan kabupaten/kota yang seharusnya menemukan
    // Sukadana. Satu jawaban yang salah menggantikan satu jawaban yang benar.
    e.tokenUnik = new Set(
      e.token.filter((t) => (
        t.length >= 6
        && !KATA_PROVINSI.has(t)
        && (hitungTokenJenis.get(`${e.jenis}::${t}`) || 0) === 1
      )),
    )
  }

  // Pasang sebutan populer, dan buang yang namanya tidak ada di data induk
  // supaya tabel alias tidak diam-diam menjadi usang.
  const perNama = new Map(entri.map((e) => [e.nama, e]))
  let sebutanTerpasang = 0
  const sebutanTakDikenal = []
  for (const [alias, namaResmi] of SEBUTAN_POPULER) {
    if (!namaResmi) continue
    const target = perNama.get(namaResmi)
    if (!target) { sebutanTakDikenal.push(namaResmi); continue }
    target.sebutan.push(normalkanUpt(alias))
    sebutanTerpasang += 1
  }

  // Nama panjang diperiksa lebih dulu supaya "Lapas Kelas IIA Besi
  // Nusakambangan" menang atas UPT lain yang hanya bertoken "nusakambangan".
  entri.sort((a, b) => b.kunci.length - a.kunci.length)

  return {
    entri,
    jumlah: entri.length,
    // Berapa unit dari daftar induk yang tidak masuk indeks sama sekali. Angka
    // ini dilaporkan supaya sebuah unit yang hilang punya tempat untuk terlihat,
    // bukan menguap tanpa jejak seperti Rutan Negara selama ini.
    jumlahMasukan: daftarUpt.length,
    tidakTerindeks: daftarUpt.length - entri.length,
    dariWilayah,
    sebutanTerpasang,
    sebutanTakDikenal,
    jumlahBersaing: entri.filter((e) => e.bersaing).length,
  }
}

function tebakJenis(nama) {
  const n = normalkanUpt(nama)
  if (n.startsWith('rutan') || n.includes('rumah tahanan')) return 'Rutan'
  if (n.startsWith('lpka') || n.includes('pembinaan khusus anak')) return 'LPKA'
  if (n.startsWith('bapas') || n.includes('balai pemasyarakatan')) return 'Bapas'
  return 'Lapas'
}

/**
 * Mengumpulkan jendela teks di sekitar setiap penanda jenis UPT.
 * @returns {Array<{jenis:string, jendela:string, posisi:number}>}
 */
function ambilJendela(teksNormal) {
  const hasil = []
  // Penanda yang sudah terpakai, dikelompokkan MENURUT JENIS.
  //
  // Penutupan ini ada supaya "rumah tahanan negara" tidak sekaligus
  // menghasilkan jendela "rumah tahanan" dan "rutan" — tiga jendela untuk satu
  // penyebutan. Seluruh penutupan semacam itu terjadi di dalam satu jenis.
  //
  // Antar-jenis justru sebaliknya: "Lapas Anak Kutoarjo" harus menghasilkan
  // jendela LPKA sekaligus jendela Lapas. Penutupan menyeluruh membuat kalimat
  // seperti "Di lapas, anak binaan mengikuti kelas" kehilangan jendela Lapas-nya
  // hanya karena dua kata itu kebetulan bersebelahan, dan berita tentang sebuah
  // Lapas biasa berakhir tidak terpetakan. Yang menang tetap ditentukan skor
  // pada tahap berikutnya, bukan oleh urutan tabel penanda.
  const terpakai = new Map()

  for (const [penanda, jenis] of PENANDA_JENIS) {
    if (!terpakai.has(jenis)) terpakai.set(jenis, [])
    const rentang = terpakai.get(jenis)
    let dari = 0
    for (;;) {
      const posisi = teksNormal.indexOf(penanda, dari)
      if (posisi === -1) break
      dari = posisi + penanda.length

      // Harus berdiri sebagai kata utuh, bukan potongan kata lain.
      const sebelum = posisi === 0 ? ' ' : teksNormal[posisi - 1]
      if (/[a-z0-9]/.test(sebelum)) continue

      // Lewati bila jendela ini sudah tercakup penanda sejenis yang lebih panjang.
      if (rentang.some(([a, b]) => posisi >= a && posisi < b)) continue
      rentang.push([posisi, posisi + penanda.length])

      // Jendela sengaja mencakup penanda jenisnya sendiri. Tanpa itu, kata
      // "perempuan" pada "Lembaga Pemasyarakatan Perempuan Kelas IIA Jakarta"
      // ikut termakan penanda, dan unit itu tidak pernah bisa dibedakan dari
      // "Lapas Kelas IIA Jakarta" yang berada di kota yang sama.
      // Sebutan lembaga lain diperiksa pada potongan pendek tepat setelah
      // penanda jenis. Lebih jauh dari itu, kata "polri" atau "kejaksaan" bisa
      // saja milik kalimat lain yang tidak ada hubungannya dengan unitnya.
      const dekat = teksNormal.slice(posisi + penanda.length, posisi + penanda.length + JENDELA_LEMBAGA)
      if (PENANDA_BUKAN_PAS.some((l) => cocokKata(dekat, l))) continue

      const jendela = teksNormal.slice(posisi, posisi + penanda.length + JENDELA)

      hasil.push({
        jenis,
        posisi,
        // Panjang penandanya sendiri, diukur dari awal jendela. Dipakai untuk
        // menolak token yang cocok hanya karena ia bagian dari penanda —
        // lihat KATA_DALAM_PENANDA.
        panjangPenanda: penanda.length,
        jendela,
        // Bentuk rapat runtun kata di dalam jendela, dihitung sekali di sini.
        // Sebelumnya ia dihitung ulang untuk setiap kandidat, yaitu 531 kali
        // per jendela, untuk hasil yang selalu sama.
        rapat: runtunRapat(jendela),
      })
    }
  }

  return hasil.sort((a, b) => a.posisi - b.posisi)
}

/**
 * Mencocokkan satu teks berita ke master UPT.
 *
 * @param {string} teks gabungan judul, ringkasan, dan catatan
 * @param {object} indeks hasil bangunIndeks()
 * @param {object} [opsi]
 * @param {number} [opsi.maksSaran=5]
 * @returns {{
 *   nama: string|null,
 *   skor: number,
 *   metode: string,
 *   otomatis: boolean,
 *   bersaing: boolean,
 *   alasan: string,
 *   saran: Array<{nama:string, skor:number, alasan:string}>
 * }}
 */
function cocokkanUpt(teks, indeks, opsi = {}) {
  const maksSaran = opsi.maksSaran ?? 5
  const teksNormal = normalkanUpt(teks)

  if (!teksNormal) return kosong('Teks kosong')

  const jendela = ambilJendela(teksNormal)
  if (!jendela.length) {
    return kosong('Tidak ada penyebutan Lapas, Rutan, LPKA, atau Bapas dalam teks')
  }

  const nilai = new Map()

  const catat = (entri, skor, metode) => {
    const lama = nilai.get(entri.nama)
    if (!lama || skor > lama.skor) nilai.set(entri.nama, { entri, skor, metode })
  }

  for (const w of jendela) {
    for (const entri of indeks.entri) {
      // Jenis pada teks harus sejalan dengan jenis kandidat — kecuali pada satu
      // keadaan yang sudah terbukti mahal bila diabaikan.
      //
      // Wartawan memakai kata "Lapas" untuk segala tempat penahanan. Berita
      // penangkapan buronan Rutan Sukadana ditulis "kabur dari Lapas Sukadana"
      // oleh hampir seluruh media nasional, dan aturan jenis yang kaku membuang
      // semuanya — peristiwa paling penting bulan itu tidak pernah sampai ke
      // unit yang bersangkutan.
      //
      // Kelonggaran ini dibatasi tiga syarat sekaligus, supaya tidak berubah
      // menjadi sumber salah cocok:
      //   1. hanya antara Lapas dan Rutan, dua jenis yang memang dipertukarkan
      //      dalam bahasa sehari-hari. Bapas dan LPKA adalah lembaga dengan
      //      tugas berbeda — "Bapas Balikpapan" tidak boleh menjadi "Lapas
      //      Balikpapan" hanya karena nama kotanya sama;
      //   2. nama tempatnya hanya dipakai satu unit di seluruh Indonesia. Untuk
      //      Kota Agung, yang punya Lapas sekaligus Rutan, syarat ini gagal dan
      //      penyebutannya tetap diserahkan ke analis;
      //   3. skornya ditekan di bawah pencocokan sejenis, sehingga kandidat
      //      yang jenisnya benar selalu menang bila keduanya muncul.
      const jenisSama = entri.jenis === w.jenis
      const lintasJenisDiizinkan =
        !jenisSama &&
        entri.unikNasional &&
        LINTAS_JENIS.has(entri.jenis) &&
        LINTAS_JENIS.has(w.jenis)
      if (!jenisSama && !lintasJenisDiizinkan) continue

      // Sebutan populer diperiksa lebih dulu; bila wartawan menulis "Rutan
      // Salemba", itu penunjukan yang jauh lebih tegas daripada tebakan token.
      const sebutanCocok = entri.sebutan.find((s) => cocokKata(w.jendela, s))
      if (sebutanCocok) {
        catat(entri, 0.94, 'sebutan-populer')
        continue
      }

      // Bentuk rapat hanya diuji sebagai satu kata utuh, bukan sebagai
      // potongan di tengah kata lain. Tanpa penjagaan ini, "Kejagung" akan
      // ditarik menjadi "Rutan Kelas IIB Kota Agung".
      // Nama tempat yang dirapatkan media, termasuk awalan "Kota" yang pada
      // token biasa selalu dibuang. "Lapas-Rutan Kotaagung Gelar Donor Darah"
      // tidak memuat kata "agung" sebagai kata utuh, sehingga tanpa jalur ini
      // dua unit di Tanggamus tidak pernah muncul bahkan sebagai saran.
      if (entri.tempatRapat
          && (cocokKata(w.jendela, entri.tempatRapat) || w.rapat.has(entri.tempatRapat))) {
        catat(entri, jenisSama ? 0.9 : 0.8, 'nama-tempat-rapat')
        continue
      }

      const cocok = tokenYangCocok(w.jendela, entri.token, w.panjangPenanda, w.rapat)
      if (!cocok.length) continue

      // Kata subjenis tidak pernah cukup berdiri sendiri. Judul "Rumah Dinas
      // Kepala Lapas Digerebek, Perempuan 19 Tahun" pernah tertarik ke Lapas
      // Perempuan Pangkalpinang hanya karena kata "perempuan" muncul di
      // kalimat berikutnya.
      if (cocok.every((t) => TOKEN_SUBJENIS.has(t))) continue

      const rasio = cocok.length / entri.token.length

      if (rasio === 1) {
        // Makin dekat nama dengan penanda jenisnya, makin kuat. Makin banyak
        // token pembeda yang cocok, makin spesifik penunjukannya.
        const jarak = posisiTerawal(w.jendela, entri.token)
        const kedekatan = Math.max(0, 1 - jarak / JENDELA)
        const kekhususan = Math.min(1, (entri.token.length - 1) / 2)
        const penuh = Math.min(0.99, 0.76 + 0.14 * kedekatan + 0.09 * kekhususan)
        if (jenisSama) {
          catat(entri, penuh, 'nama-lengkap')
        } else {
          // Cukup untuk diterima otomatis, tetapi selalu kalah oleh kandidat
          // yang jenisnya memang cocok.
          catat(entri, Math.min(0.82, penuh - 0.1), 'nama-lintas-jenis')
        }
        continue
      }

      // Pencocokan sebagian sudah lemah dengan sendirinya; menambah ketidak-
      // cocokan jenis di atasnya menghasilkan tebakan, bukan penunjukan.
      if (!jenisSama) continue

      // Sebagian token cocok — misalnya teks menulis "Lapas Banceuy" untuk
      // "Lapas Kelas IIA Banceuy Bandung".
      const tokenPanjangCocok = cocok.some((t) => t.length >= 5)
      if (rasio < 0.5 || !tokenPanjangCocok) continue

      let skor = 0.4 + 0.32 * rasio
      if (entri.petunjuk && cocokKata(w.jendela, entri.petunjuk)) skor += 0.12
      if (entri.kabkota && cocokKata(teksNormal, entri.kabkota)) skor += 0.08
      if (entri.kelas && w.jendela.includes(`kelas ${entri.kelas}`)) skor += 0.1
      if (entri.subjenis !== 'Umum' && cocokKata(w.jendela, normalkanUpt(entri.subjenis))) skor += 0.1

      // Token yang hanya dimiliki satu unit di seluruh Indonesia.
      //
      // Data induk memakai nama panjang, media memakai nama pendek: unitnya
      // tercatat "Lapas Kelas IIA Ngaseman Nusakambangan", beritanya menulis
      // "Lapas Kelas IIA Ngaseman". Separuh token cocok, dan separuh itu
      // menghasilkan 66 persen — di bawah ambang, sehingga beritanya tidak
      // terpetakan meskipun tidak ada unit lain di Indonesia yang bisa
      // dimaksud.
      //
      // Rasio jumlah token adalah ukuran yang keliru untuk keadaan ini. Yang
      // menentukan bukan berapa banyak kata yang cocok, melainkan apakah kata
      // yang cocok itu menunjuk satu unit saja. "Ngaseman" menunjuk satu;
      // "Nusakambangan", yang dipakai sembilan unit, tidak menunjuk apa pun
      // sendirian — dan karena itu tidak ikut memberi tambahan.
      const adaTokenUnik = cocok.some((t) => entri.tokenUnik.has(t))
      if (adaTokenUnik) skor += 0.16

      catat(entri, Math.min(0.9, skor), adaTokenUnik ? 'nama-token-unik' : 'nama-sebagian')
    }
  }

  // Penyebutan lewat nama kabupaten/kota, bukan nama unitnya.
  //
  // "Napi kabur dari Rutan Lampung Timur" tidak memuat kata "Sukadana" sama
  // sekali, padahal Rutan Kelas IIB Sukadana adalah satu-satunya rutan di
  // kabupaten itu. Lapisan ini hanya dijalankan ketika tidak ada satu pun
  // kandidat dari nama unit, dan hanya menerima kabupaten/kota yang menaungi
  // tepat satu UPT — nama provinsi sengaja tidak dipakai, sebab "Lapas Lampung"
  // bisa berarti belasan unit dan menebak salah satunya lebih buruk daripada
  // mengaku tidak tahu.
  //
  // Syaratnya bukan "belum ada kandidat sama sekali", melainkan "belum ada
  // kandidat yang cukup kuat". Judul yang menyebut Rutan Lampung Timur selalu
  // lebih dulu menghasilkan kandidat lemah dari kata "Lampung" pada nama unit
  // lain; bila kehadiran kandidat lemah itu menutup lapisan ini, wilayahnya
  // tidak pernah sempat diperiksa dan beritanya tetap tidak terpetakan.
  const adaYangKuat = [...nilai.values()].some((v) => v.skor >= AMBANG_OTOMATIS)
  if (!adaYangKuat) {
    for (const w of jendela) {
      for (const entri of indeks.entri) {
        if (entri.jenis !== w.jenis) continue
        if (!entri.kabkotaUnik) continue
        if (entri.token.some((t) => cocokKata(w.jendela, t))) continue
        if (!cocokKata(w.jendela, entri.kabkota)) continue
        catat(entri, 0.78, 'wilayah-kabkota')
      }
    }
  }

  // Sebutan populer yang muncul tanpa penanda jenis sama sekali — misalnya
  // judul yang hanya menulis "Tanjung Gusta" — tetap ditangkap, dengan skor
  // lebih rendah karena penunjukannya kurang tegas.
  if (!nilai.size) {
    for (const entri of indeks.entri) {
      const sebutanCocok = entri.sebutan.find((s) => cocokKata(teksNormal, s))
      if (sebutanCocok) catat(entri, 0.74, 'sebutan-tanpa-jenis')
    }
  }

  if (!nilai.size) {
    return kosong('Penanda jenis UPT ditemukan, tetapi nama unitnya tidak dikenali')
  }

  const urut = [...nilai.values()].sort((a, b) => b.skor - a.skor)
  const juara = urut[0]
  const kembar = urut.filter((u) => Math.abs(u.skor - juara.skor) < 0.02)

  const bersaing = juara.entri.bersaing || kembar.length > 1
  const otomatis = juara.skor >= AMBANG_OTOMATIS && !bersaing

  return {
    nama: otomatis ? juara.entri.nama : null,
    skor: Number(juara.skor.toFixed(3)),
    metode: juara.metode,
    otomatis,
    bersaing,
    alasan: susunAlasan(juara, bersaing, otomatis),
    saran: urut
      .filter((u) => u.skor >= AMBANG_SARAN)
      .slice(0, maksSaran)
      .map((u) => ({
        nama: u.entri.nama,
        skor: Number(u.skor.toFixed(3)),
        provinsi: u.entri.provinsi,
        kanwil: u.entri.kanwil,
        alasan: u.metode === 'nama-lengkap' ? 'Nama unit tersebut utuh setelah penanda jenis' : 'Sebagian nama unit cocok',
      })),
  }
}

/**
 * Kata subjenis. Membedakan unit, tetapi tidak pernah menunjuk satu unit
 * sendirian — ada puluhan Lapas Perempuan dan puluhan Lapas Narkotika.
 */
const TOKEN_SUBJENIS = new Set(['perempuan', 'narkotika', 'anak', 'terbuka', 'pemuda', 'wanita'])

/**
 * Mencari token nama unit di dalam jendela, termasuk ketika media menulisnya
 * rapat tanpa spasi.
 *
 * Persoalannya nyata, dan ia punya DUA arah.
 *
 * Arah pertama: data induk menulis "Lapas Narkotika Kelas IIA Tanjung Pinang",
 * berita menulis "Tanjungpinang". Menguji token satu per satu gagal pada
 * "tanjung" dan "pinang"; menguji seluruh nama dirapatkan gagal karena
 * "narkotika" tetap terpisah. Yang berhasil adalah merapatkan setiap runtun
 * token yang berurutan — "tanjung pinang" menjadi "tanjungpinang".
 *

  const negatif = yangMuncul(konteks, PENANDA_NEGATIF).length

  // mesin sendiri menilai lebih tinggi, penilaian mesin yang dipakai.

/**
 * Bagan. Digambar sebagai SVG langsung, tanpa pustaka apa pun.
 *
 * Aturan warna yang dipakai di sini:
 *
 *   Urgensi bersifat berurut (Rendah → Kritis), jadi diberi satu rona yang
 *   menua dari terang ke gelap. Empat rona berbeda untuk sesuatu yang berurut
 *   akan menyesatkan mata: pembaca akan mengira keempatnya setara.
 *
 *   Sentimen bersifat kutub (Positif ↔ Negatif), jadi diberi skala menyebar:
 *   dua rona berlawanan dengan abu-abu netral di tengah.
 *
 *   Jumlah per kategori bersifat besaran, jadi diberi satu rona bertingkat.
 *
 * Palet menyebar untuk mode gelap sudah diuji dengan validator: pemisahan CVD
 * ΔE 12,0 dan pemisahan penglihatan normal ΔE 17,5, keduanya lulus, dan seluruh
 * langkah mencapai kontras minimal 3:1 terhadap permukaan gelap. Dua peringatan
 * yang tersisa dari validator — pita terang dan lantai kroma — memang tidak
 * berlaku di sini, karena keduanya menguji palet kategoris, sedangkan abu-abu
 * di tengah skala menyebar justru wajib terbaca sebagai abu-abu.

function token(nama, cadangan) {
  const nilai = getComputedStyle(document.documentElement).getPropertyValue(nama).trim()
  return nilai || cadangan
}

function gelap() {
  const stempel = document.documentElement.dataset.tema
  if (stempel === 'gelap') return true
  if (stempel === 'terang') return false
  return globalThis.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false

 * Warna per ember sentimen, bukan per nilai basis data.
 *
 * Dulu "Campuran" punya warnanya sendiri di donat ini, sehingga pembaca melihat
 * empat golongan sementara keputusan analis hanya mengenal tiga. Kuncinya
 * sekarang kode ember dari lib/sentimen.js.

function paletSentimen() {

    ? { positif: '#2FBF97', netral: '#79859A', belum: '#5C6674', negatif: '#FA7C6A' }
    : { positif: '#1F6B50', netral: '#7C8798', belum: '#A8B0BC', negatif: '#8E1B14' }
}

function paletUrgensi() {
  return gelap()
    ? { Rendah: '#8C4A2E', Sedang: '#B36A42', Tinggi: '#D18F63', Kritis: '#F0A894' }
    : { Rendah: '#D9A183', Sedang: '#C0754A', Tinggi: '#9E4E22', Kritis: '#762012' }
}

function el(nama, sifat = {}, isi = []) {
  const n = document.createElementNS(NS, nama)
  for (const [k, v] of Object.entries(sifat)) {

    n.setAttribute(k, String(v))

  for (const anak of [].concat(isi)) {

  let d = `M ${titik[0][0]} ${titik[0][1]}`
  for (let i = 1; i < titik.length; i++) {
    const [x0, y0] = titik[i - 1]
    const [x1, y1] = titik[i]
    const dx = (x1 - x0) * 0.4

  }

function pasangPetunjuk(wadah) {
  let kotak = wadah.querySelector('.petunjuk')
  if (!kotak) {
    kotak = document.createElement('div')
    kotak.className = 'petunjuk'
    kotak.style.cssText = `
      position:absolute; pointer-events:none; opacity:0; z-index:6;
      background:var(--surface-2); border:1px solid var(--line);
      border-radius:var(--r-2); box-shadow:var(--bayang-2);
      padding:7px 9px; font-size:12px; min-width:120px;
      transition:opacity 90ms linear;`
    wadah.appendChild(kotak)
  }
  return kotak
}

function tampilkanPetunjuk(wadah, kotak, x, y, html) {
  kotak.innerHTML = html

  kotak.style.top = `${Math.max(6, y - kotak.offsetHeight - 12)}px`

/* ------------------------------------------------------- 1. Tren dua deret */

/**

  // diunduh. Lebih baik mengatakannya terus terang daripada membiarkan tombol
  // ditekan tanpa terjadi apa-apa.
  if (KONFIG.mode === 'demo') {

    return
  }

  const kepala = ['Judul', 'UPT', 'Media', 'Platform', 'Kategori', 'Subkategori',
    'Sentimen', 'Urgensi', 'Status', 'Waktu masuk', 'Tautan']
  const sel = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`
  const baris = daftar.map((b) => [
    b.judul, b.nama_upt, b.media, b.platform, b.kategori, b.subkategori,
    b.sentimen, b.urgensi, b.status_verifikasi, tanggalJam(b.created_at), b.link,
  ].map(sel).join(','))

  const isi = '﻿' + [kepala.map(sel).join(','), ...baris].join('\r\n')

  const tautan = document.createElement('a')
  tautan.href = URL.createObjectURL(berkas)
  tautan.download = `trans-siber-pas-berita-${new Date().toISOString().slice(0, 10)}.csv`
  tautan.click()
  setTimeout(() => URL.revokeObjectURL(tautan.href), 1000)
}

/** Sebaran wilayah sebagai pita bertingkat, bukan peta — cetak tetap terbaca. */
function baganProvinsi(perProvinsi) {
  if (!perProvinsi.length) return '<p class="samar">Belum ada peristiwa yang terhubung ke provinsi.</p>'
  const maks = Math.max(...perProvinsi.map((p) => p.publikasi), 1)
  return `<div class="wilayah">${perProvinsi.slice(0, 10).map((p) => `
    <div class="wilayah-baris">
      <span class="wilayah-nama">${esc(p.nama)}</span>
      <div class="wilayah-lacak">
        <i style="width:${(p.publikasi / maks) * 100}%"></i>
      </div>
      <b class="wilayah-angka">${angka(p.publikasi)}</b>
      <span class="wilayah-sub">${angka(p.peristiwa)} peristiwa</span>
    </div>`).join('')}</div>`
}

function potong(teks, n) {
  const t = String(teks ?? '').trim()
  return t.length <= n ? t : `${t.slice(0, n - 1).trimEnd()}…`
}

        <b>${angka(konteks.total || 0)}</b> publikasi dalam lingkup Pemasyarakatan

function bagianCatatan(d, opsi) {

      <li>Klasifikasi dikerjakan mesin aturan Trans-Siber PAS dan

function waktuSusun(iso) {
  const t = new Date(iso)
  if (Number.isNaN(t.getTime())) return '-'
  const wib = new Date(t.getTime() + 7 * 3600000)
  const jam = String(wib.getUTCHours()).padStart(2, '0')
  const menit = String(wib.getUTCMinutes()).padStart(2, '0')
  return `${tanggalPanjang(wib.toISOString())} pukul ${jam}.${menit} WIB`
}

 *   adalah pernyataan — siapa pun yang melihat titik merah menyimpulkan ada
 *   yang gawat — dan pernyataan itu harus memakai aturan yang sama dengan
 *   seluruh angka lain di sistem ini.
 *
 *   Ketidakpastian koordinatnya dinyatakan di layar, bukan disembunyikan.
 *   Sebagian besar unit masih memakai titik pusat kota, bukan alamat gedung.
 *   Peta yang tidak mengatakannya mengundang pembacanya menyimpulkan jarak
 *   antarunit dari sesuatu yang tidak pernah dimaksudkan untuk itu.
 */

const { kartu, keping, pesanSistem, tombol, roti } = __minta('js/ui/komponen.js');
const { amankan, angka, ringkas, jarakWaktu, nadaUrgensi } = __minta('js/lib/format.js');
const { ikon } = __minta('js/lib/ikon.js');
const { ambil, pesanRamah } = __minta('js/lib/api.js');
const { KERAWANAN, tingkatKerawanan, dasar } = __minta('js/lib/hitung.js');
const { ember } = __minta('js/lib/sentimen.js');
const { belumTerpetakan } = __minta('js/lib/pencocokan-upt.js');
const { BATAS, DARATAN, TETANGGA } = __minta('js/lib/peta-indonesia.js');

/** Jenis unit yang digambar. Bapas dan rumah sakit tidak termasuk data induk. */
const JENIS = ['Lapas', 'Rutan', 'LPKA']

/**
 * Warna tiap tingkat kerawanan.
 *
 * Bukan empat rona setara, melainkan satu deret yang menua dari hijau ke merah,
 * sebab kerawanan bersifat berurut. Unit tanpa pemberitaan diberi abu-abu
 * berlubang — ia bukan derajat paling ringan, melainkan keadaan yang berbeda
 * jenisnya: kita tidak tahu apa-apa tentangnya.
 */
const WARNA = {
  terang: { kritis: '#A81E0E', rawan: '#C0754A', waspada: '#C9A227', aman: '#1F6B50', sepi: '#9AA4B2' },
  gelap: { kritis: '#FF7B62', rawan: '#E39A63', waspada: '#E2C15C', aman: '#3FC79B', sepi: '#5E6A7A' },
}

function gelap() {
  const stempel = document.documentElement.dataset.tema
  if (stempel === 'gelap') return true
  if (stempel === 'terang') return false
  return globalThis.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false
}

function warna(kode) {
  return (gelap() ? WARNA.gelap : WARNA.terang)[kode] || WARNA.terang.sepi
}

/** Keadaan halaman, bertahan selama sesi supaya saringan tidak hilang. */
const keadaanPeta = {
  dimuat: false,
  galat: null,
  unit: [],
  kanwil: 'Seluruh Indonesia',
  jenis: 'Semua jenis',
  hanyaBermasalah: false,
  /** Unit yang sedang dibuka pada panel samping. */
  dipilih: null,
  /** Kotak pandang SVG: [x, y, lebar, tinggi] dalam derajat. */
  pandang: null,
}

const PANDANG_AWAL = () => [
  BATAS.minLon - 0.6,
  -BATAS.maxLat - 0.6,
  (BATAS.maxLon - BATAS.minLon) + 1.2,
  (BATAS.maxLat - BATAS.minLat) + 1.2,
]

/* --------------------------------------------------------------- gambar */

/**
 * Membangun SVG petanya.
 *
 * Lintang dibalik tandanya, bukan dibalik lewat transformasi kelompok. Kalau
 * memakai transformasi, seluruh teks dan lingkaran di dalamnya ikut terbalik
 * dan harus dibalik lagi satu per satu — dan yang lupa dibalik akan terbaca
 * sebagai tulisan cermin.
 */
function svgPeta(titik) {
  const [x, y, l, t] = keadaanPeta.pandang
  const skala = l / (BATAS.maxLon - BATAS.minLon)

  // Titik ikut mengecil saat diperbesar, tetapi tidak sebanding penuh: pada
  // perbesaran penuh, titik yang benar-benar sebanding akan lebih kecil
  // daripada kursor yang mengarahkannya.
  const jari = Math.max(0.055, 0.14 * Math.sqrt(skala))

  return `
    <svg class="peta-svg" viewBox="${x} ${y} ${l} ${t}" role="img"
         aria-label="Peta sebaran ${angka(titik.length)} unit pemasyarakatan di Indonesia"
         preserveAspectRatio="xMidYMid meet">
      <g class="peta-tetangga">
        ${TETANGGA.map((d) => `<path d="${balik(d)}"/>`).join('')}
      </g>
      <g class="peta-daratan">
        ${DARATAN.map((d) => `<path d="${balik(d)}"/>`).join('')}
      </g>
      <g class="peta-titik">
        ${titik.map((u) => `
          <circle cx="${u.lon}" cy="${-u.lat}" r="${jari}"
                  fill="${warna(u.tingkat.kode)}"
                  fill-opacity="${u.tingkat.kode === 'sepi' ? 0.42 : 0.92}"
                  stroke-width="${jari * 0.28}"
                  data-unit="${amankan(u.nama)}"
                  tabindex="0" role="button"
                  aria-label="${amankan(u.nama)} — ${amankan(u.tingkat.label)}, ${angka(u.berita.length)} berita">
            <title>${amankan(u.nama)} — ${amankan(u.tingkat.label)} · ${angka(u.berita.length)} berita</title>
          </circle>`).join('')}
      </g>
    </svg>`
}

/**
 * Membalik tanda lintang pada sebuah jalur.
 *
 * Bujur naik ke kanan seperti X pada SVG, tetapi lintang naik ke atas
 * sedangkan Y turun ke bawah. Tanpa pembalikan ini Indonesia tergambar
 * terbalik — dan terbaliknya tidak kentara, sebab kepulauan ini nyaris
 * setangkup terhadap khatulistiwa.
 */
const jalurBalik = new Map()
function balik(d) {
  const tersimpan = jalurBalik.get(d)
  if (tersimpan) return tersimpan
  const hasil = d.replace(/([ML])(-?[\d.]+) (-?[\d.]+)/g, (_, huruf, lon, lat) =>
    `${huruf}${lon} ${-Number(lat)}`)
  jalurBalik.set(d, hasil)
  return hasil
}

/* ------------------------------------------------------------- penyusun */

/**
 * Menggabungkan data induk unit dengan berita yang terpetakan kepadanya.
 *
 * Pencocokannya lewat `nama_upt` persis, sama seperti yang dipakai policy basis
 * data. Berita yang unitnya belum terpetakan tidak jatuh ke unit mana pun, dan
 * jumlahnya disebutkan tersendiri di layar — bukan dibagi rata atau diam-diam
 * dilekatkan ke unit terdekat.
 */
function susunTitik(unitInduk, berita) {
  const perUnit = new Map()
  for (const b of berita) {
    if (belumTerpetakan(b.nama_upt)) continue
    const kumpulan = perUnit.get(b.nama_upt) || []
    kumpulan.push(b)
    perUnit.set(b.nama_upt, kumpulan)
  }

  return unitInduk.map((u) => {
    const miliknya = perUnit.get(u.nama) || []
    return { ...u, berita: miliknya, tingkat: tingkatKerawanan(miliknya) }
  })
}

function saringTitik(titik) {
  return titik
    .filter((u) => keadaanPeta.kanwil.startsWith('Seluruh') || u.kanwil === keadaanPeta.kanwil)
    .filter((u) => keadaanPeta.jenis.startsWith('Semua') || u.jenis === keadaanPeta.jenis)
    .filter((u) => !keadaanPeta.hanyaBermasalah
      || ['kritis', 'rawan', 'waspada'].includes(u.tingkat.kode))
}

/* --------------------------------------------------------------- bagian */

function legenda(titik) {
  return `
    <div class="peta-legenda">
      ${KERAWANAN.map((k) => {
        const jumlah = titik.filter((u) => u.tingkat.kode === k.kode).length
        return `
          <span class="peta-legenda-butir" title="${amankan(k.ket)}">
            <i style="background:${warna(k.kode)};opacity:${k.kode === 'sepi' ? 0.45 : 1}"></i>
            ${amankan(k.label)}
            <b class="angka">${angka(jumlah)}</b>
          </span>`
      }).join('')}
    </div>`
}

/** Panel samping: unit yang sedang dipilih, atau daftar yang paling gawat. */
function panelSamping(titik) {
  const dipilih = keadaanPeta.dipilih
    ? titik.find((u) => u.nama === keadaanPeta.dipilih)
    : null

  if (dipilih) return panelUnit(dipilih)

  const gawat = titik
    .filter((u) => ['kritis', 'rawan'].includes(u.tingkat.kode))
    .sort((a, b) => {
      const urut = { kritis: 2, rawan: 1 }
      return (urut[b.tingkat.kode] - urut[a.tingkat.kode]) || (b.berita.length - a.berita.length)
    })
    .slice(0, 14)

  return `
    <div class="peta-panel">
      <div class="peta-panel-kop">
        <span class="label-mono">Unit paling disorot</span>
        <span class="mini-teks samar-teks">${angka(gawat.length)} teratas</span>
      </div>
      ${gawat.length ? `
        <ul class="peta-daftar">
          ${gawat.map((u) => `
            <li>
              <button data-unit="${amankan(u.nama)}">
                <i style="background:${warna(u.tingkat.kode)}"></i>
                <span>
                  <span class="peta-daftar-nama">${amankan(u.nama)}</span>
                  <span class="mini-teks samar-teks">${amankan(u.kanwil || u.provinsi || '')}</span>
                </span>
                <b class="angka">${angka(u.berita.length)}</b>
              </button>
            </li>`).join('')}
        </ul>`
        : `<p class="ket" style="padding:12px 2px">Tidak ada unit berkategori rawan atau kritis
           pada saringan ini. Itu keadaan yang baik — dan patut diperiksa ulang bila saringannya
           terlalu sempit.</p>`}
    </div>`
}

function panelUnit(u) {
  const inti = dasar(u.berita)
  const negatif = inti.filter((b) => ember(b) === 'negatif')
  const mendesak = inti.filter((b) => ['Tinggi', 'Kritis'].includes(b.urgensi))
  const terbaru = [...inti]
    .sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')))
    .slice(0, 6)

  return `
    <div class="peta-panel">
      <div class="peta-panel-kop">
        <span class="label-mono">Unit terpilih</span>
        <button class="tbl kecil samar" data-aksi="tutup-unit">${ikon('tutup')}Tutup</button>
      </div>

      <h3 class="peta-panel-judul">${amankan(u.nama)}</h3>
      <p class="mini-teks samar-teks">
        ${amankan(u.jenis || '')}${u.provinsi ? ` · ${amankan(u.provinsi)}` : ''}<br>
        ${amankan(u.kanwil || '')}
      </p>

      <div class="baris gap-6" style="margin:10px 0 12px">
        ${keping(u.tingkat.label, u.tingkat.nada)}
        <span class="mini-teks samar-teks">${amankan(u.tingkat.ket)}</span>
      </div>

      <dl class="peta-angka">
        <div><dt>Berita</dt><dd class="angka">${angka(inti.length)}</dd></div>
        <div><dt>Negatif</dt><dd class="angka">${angka(negatif.length)}</dd></div>
        <div><dt>Mendesak</dt><dd class="angka">${angka(mendesak.length)}</dd></div>
      </dl>

      ${terbaru.length ? `
        <div class="peta-panel-kop" style="margin-top:14px">
          <span class="label-mono">Pemberitaan terakhir</span>
        </div>
        <ul class="peta-berita">
          ${terbaru.map((b) => `
            <li>
              <span class="peta-berita-judul">${amankan(ringkas(b.judul || 'Tanpa judul', 92))}</span>
              <span class="mini-teks samar-teks">
                ${keping(b.urgensi || '—', nadaUrgensi(b.urgensi), true)}
                ${amankan(b.media || '')} · ${amankan(jarakWaktu(b.created_at))}
              </span>
            </li>`).join('')}
        </ul>`
        : `<p class="ket" style="margin-top:12px">Belum ada berita yang terpetakan ke unit ini.
           Titiknya tetap digambar — sebuah unit yang tidak pernah diberitakan bukan unit yang
           tidak ada.</p>`}

      <p class="ket" style="margin-top:14px">
        Koordinat: ${u.lat.toFixed(4)}, ${u.lon.toFixed(4)}
      </p>
    </div>`
}

/* -------------------------------------------------------------- halaman */

function halamanPeta({ keadaan, isi }) {
  if (!keadaanPeta.pandang) keadaanPeta.pandang = PANDANG_AWAL()

  function gambar() {
    if (keadaanPeta.galat) {
      isi.innerHTML = kartu({
        isi: pesanSistem(`<b>Data induk unit gagal dimuat.</b> ${amankan(keadaanPeta.galat)}`,
          'kritis', 'peringatan'),
      })
      return
    }

    if (!keadaanPeta.dimuat) {
      isi.innerHTML = kartu({ isi: '<div class="rangka" style="height:420px"></div>' })
      return
    }

    const semua = susunTitik(keadaanPeta.unit, keadaan.berita || [])
    const titik = saringTitik(semua)
    const kanwilAda = [...new Set(semua.map((u) => u.kanwil).filter(Boolean))].sort()
    const takTerpetakan = (keadaan.berita || []).filter((b) => belumTerpetakan(b.nama_upt)).length

    isi.innerHTML = `
      <div class="tumpuk">
        <div class="bilah-alat">
          <select class="pilihan" data-saring="kanwil" aria-label="Saring kantor wilayah"
                  style="width:auto;min-width:230px">
            ${['Seluruh Indonesia', ...kanwilAda].map((k) =>
              `<option${k === keadaanPeta.kanwil ? ' selected' : ''}>${amankan(k)}</option>`).join('')}
          </select>

          <select class="pilihan" data-saring="jenis" aria-label="Saring jenis unit"
                  style="width:auto;min-width:130px">
            ${['Semua jenis', ...JENIS].map((j) =>
              `<option${j === keadaanPeta.jenis ? ' selected' : ''}>${amankan(j)}</option>`).join('')}
          </select>

          <button class="tbl kecil${keadaanPeta.hanyaBermasalah ? ' utama' : ''}"
                  data-aksi="hanya-bermasalah"
                  aria-pressed="${keadaanPeta.hanyaBermasalah}">
            ${ikon('saring')}Hanya yang bermasalah
          </button>

          <div class="dorong baris gap-6">
            <span class="mini-teks samar-teks">
              ${angka(titik.length)} dari ${angka(semua.length)} unit
            </span>
            ${tombol({ label: 'Perbesar', ikon: 'tambah', kecil: true, aksi: 'perbesar', judul: 'Perbesar peta' })}
            ${tombol({ label: 'Perkecil', ikon: 'kurang', kecil: true, aksi: 'perkecil', judul: 'Perkecil peta' })}
            ${tombol({ label: 'Seluruh Indonesia', ikon: 'peta', kecil: true, aksi: 'pandang-awal' })}
          </div>
        </div>

        <div class="peta-tata">
          ${kartu({
            rapat: true,
            isi: `
              <div class="peta-wadah" id="peta-wadah">
                ${svgPeta(titik)}
              </div>
              ${legenda(titik)}
              <p class="ket peta-catatan">
                ${ikon('info')}
                <span>
                  Titik menunjukkan letak wilayah unit, <b>bukan alamat gedungnya</b>: koordinat
                  sebagian besar unit masih berupa titik pusat kota atau kabupaten dan menunggu
                  verifikasi. Jarak antartitik karena itu tidak dapat dipakai sebagai jarak
                  sebenarnya.
                  ${takTerpetakan ? `<br>${angka(takTerpetakan)} berita belum terpetakan ke unit mana pun,
                    sehingga tidak mewarnai satu titik pun.` : ''}
                </span>
              </p>`,
          })}
          ${panelSamping(titik)}
        </div>
      </div>`

    pasangGeser()
  }

  /* ----------------------------------------------------------- pandang */

  /** Memperbesar atau memperkecil dari titik tengah kotak pandang. */
  function ubahPandang(faktor) {
    const [x, y, l, t] = keadaanPeta.pandang
    const penuh = PANDANG_AWAL()
    const lebarBaru = Math.min(penuh[2], Math.max(2, l * faktor))
    const tinggiBaru = lebarBaru * (t / l)

    // Titik tengah dipertahankan, lalu dikembalikan ke dalam batas peta —
    // memperkecil dari tepi tidak boleh menggeser Indonesia keluar layar.
    const tengahX = x + l / 2
    const tengahY = y + t / 2
    const batasX = Math.min(Math.max(tengahX - lebarBaru / 2, penuh[0]), penuh[0] + penuh[2] - lebarBaru)
    const batasY = Math.min(Math.max(tengahY - tinggiBaru / 2, penuh[1]), penuh[1] + penuh[3] - tinggiBaru)

    keadaanPeta.pandang = [batasX, batasY, lebarBaru, tinggiBaru]
    gambar()
  }

  /**
   * Menggeser peta dengan seretan tetikus.
   *
   * Tanpa ini, memperbesar hanya berguna untuk daerah yang kebetulan berada di
   * tengah — dan seluruh Indonesia timur tidak pernah bisa dilihat dari dekat.
   */
  function pasangGeser() {
    const svg = isi.querySelector('.peta-svg')
    if (!svg) return

    let seret = null

    svg.addEventListener('pointerdown', (ev) => {
      if (ev.target.closest('[data-unit]')) return
      seret = { x: ev.clientX, y: ev.clientY, pandang: [...keadaanPeta.pandang] }
      svg.setPointerCapture(ev.pointerId)
      svg.classList.add('menyeret')
    })

    svg.addEventListener('pointermove', (ev) => {
      if (!seret) return
      const kotak = svg.getBoundingClientRect()
      const [, , l, t] = seret.pandang
      const geserX = ((ev.clientX - seret.x) / kotak.width) * l
      const geserY = ((ev.clientY - seret.y) / kotak.height) * t
      const penuh = PANDANG_AWAL()
      keadaanPeta.pandang = [
        Math.min(Math.max(seret.pandang[0] - geserX, penuh[0]), penuh[0] + penuh[2] - l),
        Math.min(Math.max(seret.pandang[1] - geserY, penuh[1]), penuh[1] + penuh[3] - t),
        l, t,
      ]
      svg.setAttribute('viewBox', keadaanPeta.pandang.join(' '))
    })

    const lepas = (ev) => {
      if (!seret) return
      seret = null
      svg.classList.remove('menyeret')
      try { svg.releasePointerCapture(ev.pointerId) } catch { /* penunjuk sudah dilepas */ }
    }
    svg.addEventListener('pointerup', lepas)
    svg.addEventListener('pointercancel', lepas)
  }

  /* ---------------------------------------------------------- penyimak */

  isi.addEventListener('change', (ev) => {
    const bidang = ev.target.dataset.saring
    if (!bidang) return
    keadaanPeta[bidang] = ev.target.value
    keadaanPeta.dipilih = null

    /*
       Memilih satu kantor wilayah memperbesar peta ke wilayah itu.

       Menyaring tanpa memperbesar berarti pembacanya melihat seluruh Indonesia
       dengan sebagian besar titiknya lenyap — yang terbaca sebagai peta yang
       rusak, bukan sebagai peta yang disaring.
    */
    if (bidang === 'kanwil') keadaanPeta.pandang = pandangUntukKanwil(ev.target.value)
    gambar()
  })

  /** Kotak pandang yang memuat seluruh unit sebuah kantor wilayah, dengan tepi. */
  function pandangUntukKanwil(kanwil) {
    if (kanwil.startsWith('Seluruh')) return PANDANG_AWAL()

    const milik = keadaanPeta.unit.filter((u) => u.kanwil === kanwil)
    if (!milik.length) return PANDANG_AWAL()

    const lon = milik.map((u) => u.lon)
    const lat = milik.map((u) => -u.lat)
    const tepi = 1.2
    const x = Math.min(...lon) - tepi
    const y = Math.min(...lat) - tepi
    // Kotak yang terlalu sempit membuat satu wilayah berisi satu unit
    // diperbesar sampai daratannya hilang sama sekali dari layar.
    const l = Math.max(3, Math.max(...lon) - Math.min(...lon) + tepi * 2)
    const t = Math.max(2.4, Math.max(...lat) - Math.min(...lat) + tepi * 2)
    return [x, y, l, t]
  }

  isi.addEventListener('click', (ev) => {
    const titikUnit = ev.target.closest('[data-unit]')
    if (titikUnit) {
      keadaanPeta.dipilih = titikUnit.dataset.unit
      gambar()
      return
    }

    const aksi = ev.target.closest('[data-aksi]')?.dataset.aksi
    if (aksi === 'perbesar') ubahPandang(0.6)
    else if (aksi === 'perkecil') ubahPandang(1 / 0.6)
    else if (aksi === 'pandang-awal') {
      keadaanPeta.pandang = PANDANG_AWAL()
      keadaanPeta.kanwil = 'Seluruh Indonesia'
      gambar()
    } else if (aksi === 'tutup-unit') {
      keadaanPeta.dipilih = null
      gambar()
    } else if (aksi === 'hanya-bermasalah') {
      keadaanPeta.hanyaBermasalah = !keadaanPeta.hanyaBermasalah
      gambar()
    }
  })

  // Titik dapat dicapai papan tik, jadi ia juga harus bisa dibuka dengannya.
  isi.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return
    const titikUnit = ev.target.closest('[data-unit]')
    if (!titikUnit) return
    ev.preventDefault()
    keadaanPeta.dipilih = titikUnit.dataset.unit
    gambar()
  })

  /* -------------------------------------------------------------- muat */

  async function muat() {
    if (keadaanPeta.dimuat) { gambar(); return }

    if (keadaan.demo) {
      /*
         Potret koordinat dimuat hanya di mode peragaan, dan dimuat secara
         dinamis supaya peramban petugas tidak pernah mengunduhnya pada
         penggelaran sungguhan.
      */
      const { UNIT_CONTOH } = __minta('js/lib/peta-upt-contoh.js')
      keadaanPeta.unit = UNIT_CONTOH.map(([nama, jenis, kanwil, provinsi, lat, lon]) =>
        ({ nama, jenis, kanwil, provinsi, lat, lon }))
      keadaanPeta.dimuat = true
      gambar()
      perbaruiSubjudul()
      return
    }

    try {
      const baris = await ambil('upt', {
        select: 'nama_upt,jenis_upt,kanwil,provinsi,latitude,longitude',
        aktif: 'eq.true',
        limit: 1000,
      }) || []

      keadaanPeta.unit = baris
        .filter((u) => u.latitude != null && u.longitude != null)
        .map((u) => ({
          nama: u.nama_upt,
          jenis: u.jenis_upt,
          kanwil: u.kanwil,
          provinsi: u.provinsi,
          lat: Number(u.latitude),
          lon: Number(u.longitude),
        }))

      if (!keadaanPeta.unit.length) {
        roti('Data induk unit terbaca kosong. Peta digambar tanpa titik.', 'sedang', 6000)
      }
    } catch (galat) {
      keadaanPeta.galat = pesanRamah(galat)

                      <option value="0.1"${m?.subkategori_kode === '0.1' ? ' selected' : ''}>0.1 Belum Dikelompokkan</option>
                      <option value="9.1"${m?.subkategori_kode === '9.1' ? ' selected' : ''}>9.1 Unit Non-Pemasyarakatan</option>
                      <option value="9.2"${m?.subkategori_kode === '9.2' ? ' selected' : ''}>9.2 Konten Tidak Relevan</option>
                    </select>
                  </div>

                  <fieldset class="pilih-sentimen">
                    <legend>Sentimen</legend>
                    <div class="pilih-deret">
                      ${EMBER.map((e) => {
                        const terpilih = ember(m?.sentimen || 'Netral') === e.kode
                        return `
                          <label class="pilih-kartu" data-nada="${e.nada}">
                            <input type="radio" name="in-sentimen" value="${e.kode}"${terpilih ? ' checked' : ''}>
                            <span class="pilih-isi">
                              <span class="pilih-judul">${amankan(e.label)}
                                <span class="pilih-ringkas">${amankan(e.ringkas)}</span></span>
                              <span class="pilih-ket">${amankan(e.keterangan)}</span>
                            </span>
                          </label>`
                      }).join('')}
                    </div>
                  </fieldset>

                  <div class="isian">
                    <label for="in-urgensi">Urgensi</label>
                    <select class="pilihan penuh" id="in-urgensi" name="urgensi">
                      ${URGENSI.map((u) => `<option${u === (m?.urgensi || 'Rendah') ? ' selected' : ''}>${u}</option>`).join('')}
                    </select>
                  </div>
                </div>`,
            })}
          </div>

          <div class="telaah-aksi" style="margin-top:14px">
            ${tombol({ label: 'Simpan berita', ikon: 'centang', gaya: 'utama',
              aksi: 'simpan', nonaktif: keadaanInput.sibuk })}
            ${tombol({ label: 'Kosongkan borang', ikon: 'tutup', aksi: 'kosongkan' })}
            <span class="dorong"></span>
            ${keadaanInput.terakhir
              ? tombol({ label: 'Buka antrean telaah', ikon: 'panahKanan', gaya: 'samar', aksi: 'ke-telaah' })
              : ''}
          </div>
        </form>
      </div>`
  }

  /* ------------------------------------------------------------- mesin */

  function nilaiUlang() {
    const n = keadaanInput.nilai
    const teks = `${n.judul} . ${n.ringkasan}`.trim()

    if (teks.length < 12) {
      keadaanInput.mesin = null
      keadaanInput.saranUpt = null
      return
    }

    keadaanInput.mesin = klasifikasikan({
      judul: n.judul,
      ringkasan: n.ringkasan,
      media: n.media,
      link: n.link,
    })

    if (keadaanInput.indeks) {
      const cocok = cocokkanUpt(`${n.judul} . ${n.ringkasan}`, keadaanInput.indeks)
      keadaanInput.saranUpt = cocok?.nama ? cocok : null
      // Saran yang cukup meyakinkan langsung mengisi kolomnya. Petugas yang
      // tidak setuju tinggal mengetik ulang; yang setuju tidak perlu mengetik
      // nama unit yang sudah dikenali mesin.
      if (!n.upt && cocok?.otomatis && cocok.nama) n.upt = cocok.nama
    }
  }

  /* ------------------------------------------------------------ simpan */

  function bacaBorang() {
    const ambilNilai = (id) => isi.querySelector(id)?.value ?? ''
    keadaanInput.nilai = {
      link: ambilNilai('#in-link').trim(),
      judul: ambilNilai('#in-judul').trim(),
      media: ambilNilai('#in-media').trim(),
      tanggal: ambilNilai('#in-tanggal'),
      upt: ambilNilai('#in-upt').trim(),
      ringkasan: ambilNilai('#in-ringkasan').trim(),
      catatan: ambilNilai('#in-catatan').trim(),
    }
  }

  async function simpan() {
    if (keadaanInput.sibuk) return
    bacaBorang()
    const n = keadaanInput.nilai

    if (!n.link) { roti('Tautan berita wajib diisi.', 'sedang'); isi.querySelector('#in-link')?.focus(); return }
    if (!n.judul) { roti('Judul berita wajib diisi.', 'sedang'); isi.querySelector('#in-judul')?.focus(); return }

    const tautan = normalkanTautan(n.link)
    const kodeSub = isi.querySelector('#in-sub')?.value || '0.1'
    const sub = SEMUA_SUBKATEGORI.find((s) => s.kode === kodeSub)
    const emberDipilih = isi.querySelector('input[name="in-sentimen"]:checked')?.value || 'netral'
    const urgensi = isi.querySelector('#in-urgensi')?.value || 'Rendah'
    const m = keadaanInput.mesin

    const luar = kodeSub === '9.1' || kodeSub === '9.2'
    const baris = {
      link: tautan,
      link_normalized: tautan,
      judul: n.judul,
      media: n.media || asalTautan(tautan) || 'Tidak diketahui',
      platform: kenaliPlatform(tautan),
      tanggal_publikasi: n.tanggal ? new Date(n.tanggal).toISOString() : null,
      // Kolom ini NOT NULL di basis data, dan artinya siapa yang bertanggung
      // jawab atas masuknya baris — bukan siapa yang menulis beritanya.
      nama_petugas: profil.full_name || profil.username || 'Petugas',
      created_by: profil.username || null,
      nama_upt: n.upt || 'Belum Teridentifikasi',
      ringkasan: n.ringkasan || n.judul,
      caption_manual: n.ringkasan || '',
      catatan: n.catatan || '',
      kategori: sub ? sub.kategoriNama : (luar ? 'Di Luar Lingkup' : 'Lainnya'),
      subkategori: sub ? sub.nama : (kodeSub === '0.1' ? 'Belum Dikelompokkan' : 'Konten Tidak Relevan'),
      subkategori_kode: kodeSub,
      sentimen: nilaiSimpan(emberDipilih, m?.sentimen),
      urgensi,
      tingkat_perhatian: urgensi,
      kata_kunci: m?.kata_kunci || [],
      ai_confidence: m?.ai_confidence ?? null,
      ai_provider: m?.ai_provider || 'manual',
      ai_alasan: m?.alasan || null,
      ai_classified_at: m ? new Date().toISOString() : null,
      source_type: 'manual',
      status_verifikasi: 'Belum Ditelaah',
      status_baca: 'INPUT MANUAL',
      dampak: 'UPT',
      detected_at: new Date().toISOString(),
    }

    // Petugas wilayah wajib menandai asal kirimannya; policy RLS menolak baris
    // yang tidak menyebutkannya, dan penolakan itu benar — kiriman tanpa asal
    // tidak bisa dibatasi kepada siapa pun.
    if (profil.assigned_kanwil) baris.kanwil_asal = profil.assigned_kanwil

    keadaanInput.sibuk = true
    gambar()

    if (keadaan.demo) {
      roti('Mode peragaan: berita tidak disimpan.', 'sedang', 5000)
      keadaanInput.sibuk = false
      gambar()
      return
    }

    try {
      // Kembaran diperiksa lebih dulu supaya petugas mendapat kalimat yang bisa
      // ditindaklanjuti, bukan galat kunci ganda dari basis data.
      const kembar = await ambil('berita', {
        select: 'id,judul,status_verifikasi',
        or: `(link_normalized.eq.${tautan},link.eq.${tautan})`,
        limit: 1,
      })

      if (Array.isArray(kembar) && kembar.length) {
        roti(`Tautan ini sudah tersimpan: “${kembar[0].judul || 'tanpa judul'}”.`, 'sedang', 6000)
        keadaanInput.sibuk = false
        gambar()
        return
      }

      const hasil = await sisip('berita', baris)
      const tersimpan = Array.isArray(hasil) ? hasil[0] : hasil

      // Berita baru ikut ke dalam keadaan aplikasi tanpa menunggu pemuatan
      // ulang, supaya dasbor dan antrean telaah langsung menghitungnya.
      if (tersimpan) {
        keadaan.berita.unshift(tersimpan)
        document.dispatchEvent(new CustomEvent('hitung-ulang'))
      }

      keadaanInput.terakhir = { id: tersimpan?.id, judul: n.judul }
      keadaanInput.nilai = { link: '', judul: '', media: '', tanggal: '', upt: '', ringkasan: '', catatan: '' }
      keadaanInput.mesin = null
      keadaanInput.saranUpt = null
      roti('Berita tersimpan dan masuk antrean telaah.', 'positif')
    } catch (galat) {
      roti(pesanRamah(galat), 'kritis', 7000)
    } finally {
      keadaanInput.sibuk = false
      gambar()
    }
  }

  /* ---------------------------------------------------------- penyimak */

  let jeda = null

  isi.addEventListener('input', (ev) => {
    if (!ev.target.matches('#in-link, #in-judul, #in-ringkasan, #in-media, #in-upt, #in-catatan')) return
    bacaBorang()

    // Mesin dijalankan sesudah ketikan berhenti sejenak. Menjalankannya pada
    // tiap huruf berarti menggambar ulang panel di tengah orang mengetik.
    clearTimeout(jeda)
    jeda = setTimeout(() => {
      const fokus = document.activeElement?.id
      const posisi = document.activeElement?.selectionStart
      nilaiUlang()
      gambar()
      const kembali = fokus && isi.querySelector(`#${fokus}`)
      if (kembali) {
        kembali.focus()
        try { kembali.setSelectionRange(posisi, posisi) } catch { /* bukan kolom teks */ }
      }
    }, 550)
  })

  isi.addEventListener('submit', (ev) => { ev.preventDefault(); simpan() })

  isi.addEventListener('click', (ev) => {
    const aksi = ev.target.closest('[data-aksi]')?.dataset.aksi
    if (!aksi) return

    if (aksi === 'simpan') { ev.preventDefault(); simpan() }
    else if (aksi === 'kosongkan') {
      keadaanInput.nilai = { link: '', judul: '', media: '', tanggal: '', upt: '', ringkasan: '', catatan: '' }
      keadaanInput.mesin = null
      keadaanInput.saranUpt = null
      keadaanInput.terakhir = null
      gambar()
    } else if (aksi === 'pakai-upt') {
      bacaBorang()
      keadaanInput.nilai.upt = keadaanInput.saranUpt?.nama || ''
      gambar()
    } else if (aksi === 'ke-telaah') {
      document.dispatchEvent(new CustomEvent('buka-halaman', {
        detail: { halaman: 'telaah', fokus: keadaanInput.terakhir?.id },
      }))
    }
  })

  /* -------------------------------------------------------------- muat */

  async function muatUpt() {
    if (keadaanInput.indeks || keadaan.demo) return
    try {
      const daftar = await ambil('upt', {
        select: 'nama_upt,jenis_upt,kelas_upt,subjenis_upt,provinsi,kanwil,kabupaten_kota,location_hint',
        aktif: 'eq.true',
        limit: 1000,
      })
      keadaanInput.indeks = bangunIndeks(daftar || [])
      keadaanInput.daftarUpt = (daftar || []).map((u) => u.nama_upt).filter(Boolean).sort()
      gambar()
    } catch {
      // Tanpa daftar unit, borang tetap bisa dipakai — kolom UPT hanya kehilangan
      // saran dan pelengkapan otomatisnya.
      keadaanInput.indeks = bangunIndeks([])
    }
  }

  gambar()
  muatUpt()

  return {
    judul: 'Input Berita',
    sub: 'Memasukkan publikasi yang belum tertangkap sinkronisasi',
  }
}

return { normalkanTautan, halamanInput };
});

__daftar('js/pages/sinkronisasi.js', function (__minta) {
/**
 * Sinkronisasi Sumber.
 *
 * Sejak kantor wilayah punya spreadsheet sendiri, "sinkronisasi berjalan" tidak
 * lagi berarti satu hal. Satu sumber bisa berhasil sementara sumber lain
 * ditolak Google karena aksesnya belum dibuka — dan tanpa layar ini, keadaan

 * Yang sengaja tidak ada di sini: tombol "tarik sekarang". Menariknya menuntut
 * token sinkronisasi, dan token itu tidak boleh pernah berada di peramban.
 * Penjadwal di dalam basis data sudah memanggil penyalin setiap lima menit;
 * yang dibutuhkan layar ini hanyalah menjelaskan hasilnya.
 */

const keadaanSinkron = {

/** Nada warna untuk status penyalinan. */

function soalAkses(pesan) {

function kartuSumber(s) {

  const gagal = status === 'Gagal'

  return `

          ${keping(status, nadaStatusSinkron(status))}

          <span class="mini-teks samar-teks dorong"

          <dd style="margin:0"><code>${amankan(s.kode)}</code></dd>
          <dt class="samar-teks">Wilayah</dt>
          <dd style="margin:0">${amankan(s.kanwil || (s.lingkup === 'pusat' ? 'Nasional' : 'belum ditetapkan'))}</dd>
          <dt class="samar-teks">Baris terbaca</dt>
          <dd style="margin:0">${s.baris_terakhir == null ? '—' : angka(s.baris_terakhir)}</dd>

function halamanSinkronisasi({ keadaan, isi }) {
  function gambar() {
    if (!keadaanSinkron.dimuat) {
      isi.innerHTML = kartu({ judul: 'Sumber data', isi: '<p class="samar-teks">Memuat daftar sumber…</p>' })
      return
    }

    const sumber = keadaanSinkron.sumber
    const gagal = sumber.filter((s) => s.terakhir_status === 'Gagal')

          ? pesanSistem(

               Sumber lain tetap berjalan seperti biasa — kegagalan satu spreadsheet
               tidak menghentikan yang lain.`, 'kritis', 'peringatan')
          : pesanSistem(

            ? ` · ${angka(belumPernah.length)} belum pernah ditarik` : ''}`,
          rapat: true,
          isi: `<div style="padding:14px">

          + 'membacanya pada jalan berikutnya.', 'netral', 'info')}

    }

    // Dua permintaan terpisah, dan kegagalan salah satunya tidak menghapus yang
    // lain: riwayat penarikan hanya boleh dibaca sebagian peran, sedangkan
    // daftar sumbernya lebih terbuka.
    try {
      keadaanSinkron.sumber = await ambil('sumber_sheet', {
        select: 'id,kode,nama,lingkup,kanwil,csv_url,aktif,urutan,terakhir_sinkron_at,'
          + 'terakhir_status,terakhir_pesan,baris_terakhir',
        order: 'urutan.asc',

    } catch (galat) {

      keadaanSinkron.riwayat = await ambil('sheet_sync_log', {

    } catch {
      keadaanSinkron.riwayat = []
    }

    keadaanSinkron.dimuat = true
    gambar()
  }

  gambar()
  muat()

  return {
    judul: 'Sinkronisasi Sumber',
    sub: 'Spreadsheet pusat dan kantor wilayah, beserta hasil penarikan terakhirnya',
  }
}

return { halamanSinkronisasi };
});

/* --------------------------------------------------------- tabel unit */

function tabelUnit(berita) {
  const peta = new Map()
  for (const b of berita) {
    if (belumTerpetakan(b.nama_upt)) continue
    const p = peta.get(b.nama_upt) || { nama: b.nama_upt, total: 0, negatif: 0, mendesak: 0, menunggu: 0 }
    p.total += 1
    if (ember(b) === 'negatif') p.negatif += 1
    if (['Tinggi', 'Kritis'].includes(b.urgensi)) p.mendesak += 1
    if (menungguTelaahWilayah(b)) p.menunggu += 1
    peta.set(b.nama_upt, p)
  }

  const daftar = [...peta.values()]
    .sort((a, b) => b.mendesak - a.mendesak || b.negatif - a.negatif || b.total - a.total)
    .slice(0, 10)

  if (!daftar.length) {
    return kosong('Belum ada unit terpetakan',
      'Berita di wilayah Anda belum terhubung ke unit mana pun, atau belum ada berita sama sekali.')
  }

  const puncak = Math.max(...daftar.map((u) => u.total))

  return `
  <div class="tabel-bungkus">
    <table class="tabel">
      <thead><tr>
        <th>Unit</th>
        <th style="width:120px">Sebaran</th>
        <th style="width:62px" class="rata-kanan">Total</th>
        <th style="width:72px" class="rata-kanan">Negatif</th>
        <th style="width:80px" class="rata-kanan">Mendesak</th>
        <th style="width:88px" class="rata-kanan">Menunggu</th>
      </tr></thead>
      <tbody>
        ${daftar.map((u) => `
          <tr>
            <td style="font-weight:550">${amankan(u.nama)}</td>
            <td>
              ${/* Batang perbandingan, bukan angka kedua. Mata membaca panjang
                   jauh lebih cepat daripada membandingkan enam angka sekolom. */''}
              <div class="bar-lacak" title="${angka(u.total)} berita">
                <div class="bar-isi" style="--lebar:${((u.total / puncak) * 100).toFixed(1)}%"></div>
              </div>
            </td>
            <td class="angka rata-kanan">${angka(u.total)}</td>
            <td class="angka rata-kanan">${u.negatif ? `<span style="color:var(--kritis)">${angka(u.negatif)}</span>` : '—'}</td>
            <td class="angka rata-kanan">${u.mendesak ? `<span style="color:var(--tinggi);font-weight:650">${angka(u.mendesak)}</span>` : '—'}</td>
            <td class="angka rata-kanan">${u.menunggu ? angka(u.menunggu) : '—'}</td>
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`
}

/**
 * Berita Wilayah, dan bagi petugas unit: Berita Unit.
 *
 * Menggantikan halaman "Riwayat Kiriman" yang lama. Halaman itu disusun ketika
 * satu-satunya pekerjaan daerah adalah mengirim, sehingga ia menjawab "apa yang
 * sudah saya kirim" — pertanyaan yang tidak berlaku lagi bagi dua peran daerah

  const bolehTelaah = punyaIzin(keadaan.profil?.role, 'telaah_wilayah')

  const semua = (keadaan.berita || []).filter((b) => !b.deleted_at)

  const dasarDaftar = bolehKirim && saring.lingkup === 'sendiri'
    ? semua.filter((b) => b.created_by === username)

  const kata = saring.cari.trim().toLowerCase()
  const daftar = dasarDaftar
    .filter((b) => saring.telaah.startsWith('Semua')
      || (saring.telaah === 'Belum Ditelaah'

    .filter((b) => saring.sentimen === 'semua' || ember(b) === saring.sentimen)
    .filter((b) => !kata
      || String(b.judul || '').toLowerCase().includes(kata)
      || String(b.nama_upt || '').toLowerCase().includes(kata)
      || String(b.media || '').toLowerCase().includes(kata))
